<title>목표로 고르는 AI 수업 도구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 충북 딥다이브 연수 교안(캔바) 양식을 그대로 따름: 보라 그라데이션 테두리(#7b4fe0→#9b79ee→#c4afff, 135°) 위 흰 카드,
   보라 그라데이션 머리띠(작은 라벨 + 큰 흰 제목), 연보라 칸, 보라 머리행 표, 노란 별 표시. 교안과 같은 한 가지 화면(밝은 화면)으로 고정 */
:root{
  --g1:#7b4fe0; --g2:#9b79ee; --g3:#c4afff;
  --purple:#7b4fe0; --purple-d:#5a35c2; --purple-l:#b9a3f5;
  --lav:#f3effe; --lav2:#e8e0fc; --lavline:#dcd2f8;
  --ink:#231d38; --muted:#6c6687; --white:#ffffff; --star:#f6c31c;
  --mint:#1d8466; --mint-soft:#e2f4ec; --warn:#bf561b; --warn-soft:#fdeee4;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--g1)}
body{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(16px,3.2vw,40px)}
.frame{max-width:1120px;margin:0 auto;background:var(--white);border-radius:4px;box-shadow:0 18px 50px rgb(50 20 120 / .25);
  padding:clamp(18px,4vw,48px) clamp(16px,4vw,52px);display:grid;gap:22px}

/* 표지 */
.cover{display:grid;justify-items:center;text-align:center;gap:10px;padding-bottom:6px}
.appicon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#9a6cf2,var(--purple-d));display:grid;place-items:center;box-shadow:0 6px 16px rgb(91 53 194 / .3)}
.appicon svg{width:30px;height:30px}
.kicker{font-weight:800;font-size:clamp(14px,1.8vw,18px);letter-spacing:-.01em}
.title{margin:0;font-weight:900;font-size:clamp(34px,6.4vw,64px);line-height:1.1;letter-spacing:-.03em;text-wrap:balance;
  background:linear-gradient(90deg,var(--purple) 0%,var(--g2) 60%,var(--purple-l) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:var(--lav2);color:var(--ink);font-weight:700;border-radius:999px;padding:7px 26px;font-size:clamp(14px,1.8vw,17px)}
.tabs{display:inline-flex;gap:4px;background:var(--lav);border-radius:999px;padding:4px;justify-self:center}
.tab{background:none;border:0;border-radius:999px;padding:7px 18px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--purple);color:var(--white)}
@media (max-width:520px){.tabs{display:grid;grid-template-columns:repeat(3,auto);border-radius:14px}.tab{padding:7px 10px;font-size:13px;border-radius:10px;word-break:keep-all}}
body{word-break:keep-all;overflow-wrap:anywhere}

/* 단계 = 교안 목차 칸 */
.progress{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.progress button{border:0;background:var(--lav);border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;gap:0;font:inherit;text-align:left;color:var(--ink);min-width:0}
.progress b{font-size:20px;font-weight:800;color:var(--purple-l);line-height:1.1}
.progress span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress button.done b{color:var(--purple)}
.progress button.now{background:var(--purple);color:var(--white)}
.progress button.now b{color:var(--white)}
.progress button:disabled{cursor:default;opacity:.55}
@media (max-width:720px){.progress span{display:none}.progress button{padding:6px;text-align:center}.progress b{font-size:16px}}

/* 본문 장 = 보라 머리띠 + 흰 몸통 */
.stage{border:1px solid var(--lavline);border-radius:6px;overflow:hidden;display:grid;gap:18px;padding-bottom:clamp(18px,3vw,30px)}
.stage>*:not(.band){margin-inline:clamp(16px,3vw,30px)}
.band{background:linear-gradient(90deg,var(--g1) 0%,var(--g2) 70%,#ae92f6 100%);color:var(--white);padding:clamp(16px,2.6vw,24px) clamp(16px,3vw,30px)}
.band .bl{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.02em}
.band .q,.band h2{margin:2px 0 0;font-weight:900;font-size:clamp(24px,3.8vw,38px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:62ch}
.label{font-size:13.5px;font-weight:700;color:var(--purple);margin-bottom:6px;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;border:1px solid var(--lavline);background:var(--lav);color:var(--ink);border-radius:999px;padding:7px 18px;cursor:pointer}
.chip:hover{border-color:var(--purple)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--white);font-weight:700}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opt{position:relative;font:inherit;text-align:left;border:1px solid var(--lavline);background:var(--lav);color:var(--ink);border-radius:6px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;align-content:start}
.opt:hover{border-color:var(--purple)}
.opt strong{font-size:17px;font-weight:800;padding-right:22px}
.opt span{font-size:13.5px;color:var(--muted)}
.opt em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--purple)}
#types{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){#types{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){#types{grid-template-columns:minmax(0,1fr)}}
.opt .meta{padding-right:22px}
.opt .no{font-size:28px;font-weight:800;color:var(--purple-l);line-height:1}
.opt[aria-pressed="true"]{background:var(--lav2);border-color:var(--purple);box-shadow:inset 4px 0 0 var(--purple)}
.opt[aria-pressed="true"]::after{content:"★";position:absolute;top:8px;right:12px;color:var(--star);font-size:22px;line-height:1}
.opt.none{border-style:dashed;background:var(--white)}
.meta{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.tag{border-radius:4px;padding:1px 7px;background:var(--white);border:1px solid var(--lavline);color:var(--muted);font-weight:500}
.tag.t{background:var(--purple);border-color:var(--purple);color:var(--white);font-weight:700}
.tag.v{background:var(--mint-soft);border-color:transparent;color:var(--mint);font-weight:700}
.tag.here{background:var(--lav2);border-color:transparent;color:var(--purple);font-weight:700}
.tag.link{background:var(--white);color:var(--purple);border-color:var(--purple);font-weight:700}

input[type=text],textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--lavline);background:var(--white);color:var(--ink);border-radius:6px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--purple-l);outline-offset:2px}
.row2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.examples{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
.ex{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--purple);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

.nav{display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:6px;padding:11px 22px;border:1px solid var(--lavline);background:var(--lav);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--white)}
.btn:disabled{opacity:.4;cursor:default}
.more{justify-self:start}
.picked{display:grid;gap:8px;border-top:1px dashed var(--lavline);padding-top:16px}
.why{font-size:13.5px;color:var(--muted);margin:0}
.why b{color:var(--ink)}

/* 강의 포인트 = 교안 장을 옮긴 상자 */
.point{border-radius:6px;background:var(--lav);padding:14px 18px;border:1px solid var(--lavline)}
.point summary{cursor:pointer;font-weight:800;color:var(--purple);font-size:14px}
.point .pbody{display:grid;gap:10px;margin-top:10px;font-size:14.5px}
.point .pbody p{margin:0}
.point .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.point .cell{background:var(--white);border:1px solid var(--lavline);border-radius:6px;padding:10px 12px;display:grid;gap:2px;font-size:13.5px}
.point .cell b{font-size:15px;color:var(--purple)}
.point .flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;color:var(--purple)}
.point .flowline span{background:var(--purple);color:var(--white);border-radius:999px;padding:4px 14px;font-size:13.5px}
.point .big{font-size:clamp(18px,2.4vw,22px);font-weight:900;color:var(--purple)}

.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--lavline);border-radius:6px;padding:12px 16px;background:var(--lav);cursor:pointer}
.check input{margin-top:5px;accent-color:var(--purple);width:18px;height:18px;flex:none}
.check b{display:block;font-size:16px;font-weight:800}
.check span{font-size:14px;color:var(--muted)}
.check.line{border-color:var(--warn);background:var(--warn-soft)}
.check.line b{color:var(--warn)}

.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;margin:0}
.facts dt{color:var(--purple);font-weight:700;font-size:13.5px;padding-top:1px}
.facts dd{margin:0;font-weight:500}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14.5px}
th,td{border-bottom:1px solid var(--lavline);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--purple);color:var(--white);font-weight:700;white-space:nowrap;text-align:center}
tbody tr:nth-child(odd){background:var(--lav)}
td:first-child{font-weight:800;color:var(--purple);white-space:nowrap;text-align:center}
.status{display:flex;flex-wrap:wrap;gap:6px}
.pill2{border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill2.ok{background:var(--mint-soft);color:var(--mint)}
.pill2.no{background:var(--warn-soft);color:var(--warn)}
.bridge{background:var(--purple);color:var(--white);border-radius:6px;padding:14px 18px;font-size:14.5px;font-weight:500;margin:0}
.go{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;background:var(--purple);color:var(--white);border-radius:6px;padding:9px 16px;justify-self:start}
.go:hover{background:var(--purple-d)}
.go.small{padding:3px 10px;font-size:12.5px}
.nolink{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--white);padding:8px 18px;border-radius:999px;font-size:14px;z-index:30}

/* 같은 도구, 다른 목표 */
.quote{font-weight:900;font-size:clamp(22px,3.4vw,34px);margin:0;color:var(--purple);text-align:center;letter-spacing:-.02em}
.quote::before{content:"“";display:block;font-size:1.6em;line-height:.8;color:var(--purple-l)}
.toolgroup{border:1px solid var(--lavline);border-radius:6px;overflow:hidden;display:grid}
.toolgroup h3{margin:0;font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--white);padding:10px 16px}
.toolgroup h3 small{font-weight:500;opacity:.85;font-size:13px;margin-left:8px}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:12px}
.use{border:1px solid var(--lavline);border-radius:6px;padding:10px 12px;background:var(--lav);font-size:13.5px;display:grid;gap:3px;align-content:start}
.use b{font-size:14.5px;font-weight:800}
.chip small{font-size:11.5px;font-weight:700;margin-left:6px;opacity:.8}
.muted{font-weight:500;color:var(--muted)}
.stds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.opt.std strong{font-size:15.5px;font-weight:700;line-height:1.45}
.sec{display:grid;gap:10px}
.sec h3{margin:0;font-size:16px;font-weight:800;color:var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.sec h3::before{content:"";width:4px;height:16px;background:var(--purple);border-radius:2px;align-self:center}
.sec h3 small{font-weight:500;color:var(--muted);font-size:13px}
.opt strong i{font-style:normal;color:var(--purple-l);font-weight:700}
#nowbar{position:sticky;top:8px;z-index:5}
#nowbar:empty{display:none}
.now{display:grid;gap:4px;background:var(--lav);border:1px solid var(--lavline);border-left:5px solid var(--purple);border-radius:6px;padding:10px 14px;box-shadow:0 4px 14px rgba(91,52,200,.12)}
.now .nl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.now .nl b{color:var(--purple);font-weight:800}
.now .ng{font-size:16px;font-weight:800;line-height:1.4;color:var(--ink)}
.now button{font:inherit;font-size:12.5px;font-weight:700;color:var(--purple);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;margin-left:auto}
.tag.sg{background:var(--lav);border-color:var(--lavline);color:var(--purple);font-weight:700}
.tag.x{background:#fff7d6;border-color:#f1d36b;color:#8a6400;font-weight:700}
.opt em.sug{color:var(--white);background:var(--purple);border-radius:4px;padding:1px 8px;justify-self:start}
.toolrows{display:grid;gap:8px}
.toolrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--lav);border-radius:6px;padding:10px 14px}
.toolrow b{font-size:15.5px;font-weight:800;margin-right:8px}
.toolrow span{font-size:13.5px;color:var(--muted)}
.tcell{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.go.inv{background:var(--white);color:var(--purple);margin-left:auto}
.toolgroup h3{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.grid-gap{display:grid;gap:16px}
.center{text-align:center;justify-self:center}
/* 2022 개정 성취기준 · 내용 요소 */
.chips.sm{gap:6px}
.chips.sm .chip{font-size:13.5px;padding:4px 13px}
.chip:disabled{opacity:.38;cursor:default;border-color:var(--lavline)}
input[type=search]{font:inherit;font-size:15px;width:100%;border:1px solid var(--lavline);background:var(--white);color:var(--ink);border-radius:6px;padding:9px 12px}
.stdbox{display:grid;gap:10px}
.stds{max-height:480px;overflow:auto;padding:2px 4px 2px 2px}
.ce{border:1px solid var(--lavline);border-radius:6px;padding:16px 18px;display:grid;gap:12px;background:var(--white)}
.cehead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.cehead b{font-size:18px;font-weight:900;color:var(--purple)}
.cehead span{font-size:13.5px;color:var(--muted);font-weight:700}
.cegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.cegrid{grid-template-columns:minmax(0,1fr)}}
.cecol{background:var(--lav);border-radius:6px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.cecol h4{margin:0;font-size:14px;font-weight:800;background:var(--purple);color:var(--white);border-radius:4px;padding:2px 10px;justify-self:start}
.cecol h5{margin:6px 0 0;font-size:13px;font-weight:800;color:var(--purple)}
.cecol ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.sh{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--purple);background:var(--white);border:1px solid var(--lavline);border-radius:4px;padding:0 6px;vertical-align:1px}
details.other{border:1px solid var(--line,#ddd);border-radius:12px;padding:10px 14px;background:#fff}
details.other summary{cursor:pointer;font-weight:800;color:var(--purple);font-size:14px}
details.other .opts{margin-top:10px}
details.core summary{cursor:pointer;font-weight:800;color:var(--purple);font-size:14px}
details.core ul,details.core p{margin:8px 0 0;font-size:14px}
details.core ul{padding-left:18px;display:grid;gap:4px}
.src{font-size:12.5px;color:var(--muted);margin:0}
.cerows{display:grid;gap:6px;margin-top:10px}
.cerow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start;background:var(--lav);border-radius:6px;padding:8px 12px;font-size:14px}
.cerow b{color:var(--purple);font-weight:800}
.curunit{border:1px solid var(--lavline);border-radius:6px;overflow:hidden;display:grid}
.curunit h3{margin:0;font-size:17px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--white);padding:9px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.curunit h3 small{font-weight:500;opacity:.85;font-size:13px}
.curunit .in{padding:12px 14px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--lavline);font-size:14.5px}
.srow:last-child{border-bottom:0}
.srow code{font-family:inherit;font-weight:800;color:var(--purple);font-size:13.5px}
.srow .btn{padding:4px 10px;font-size:12.5px}
@media (max-width:560px){.srow{grid-template-columns:minmax(0,1fr)}.srow .btn{justify-self:start}}
.h2c{margin:0;font-size:20px;font-weight:900;color:var(--ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.h2c small{font-size:13.5px;font-weight:500;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.stage{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="frame">
  <header class="cover">
    <div class="appicon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 26h6v-6h6v-6h6V8h4"/><path d="M19 5h8v8"/><path d="M27 5 15 17"/></svg></div>
    <div class="kicker">2026 충북 디지털 기반 교육혁신 역량강화 · AI 레벨업(심화)</div>
    <h1 class="title">목표로 고르는 AI 수업 도구</h1>
    <div class="pill">[초] AI 수업 설계의 원리와 실제 · 3-4차시</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-design" aria-selected="true">도구 고르기</button>
    <button class="tab" role="tab" id="tab-tools" aria-selected="false">같은 도구, 다른 목표</button>
    <button class="tab" role="tab" id="tab-cur" aria-selected="false">성취기준·내용 체계</button>
  </div>

  <div id="view-design" class="grid-gap">
    <nav class="progress" id="progress" aria-label="도구 고르기 단계"></nav>
    <div id="nowbar"></div>
    <section class="stage" id="stage"></section>
    <div class="nav">
      <button class="btn" id="prev">이전</button>
      <button class="btn primary" id="next">다음</button>
    </div>
  </div>

  <div id="view-tools" class="grid-gap" hidden>

"5~6","듣기⋅말하기","면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다.","개념",1],["6국01-05","국어","5~6","듣기⋅말하기","자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다.","공유",1],["6국01-06","국어","5~6","듣기⋅말하기","토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다.","탐구",1],["6국01-07","국어","5~6","듣기⋅말하기","절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다.","탐구",1],["6국02-01","국어","5~6","읽기","글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다.","개념",1],["6국02-02","국어","5~6","읽기","글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다.","탐구",1],["6국02-03","국어","5~6","읽기","글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다.","평가",1],["6국02-04","국어","5~6","읽기","문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.","개념",1],["6국02-05","국어","5~6","읽기","긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다.","공유",1],["6국03-01","국어","5~6","쓰기","알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.","창작",1],["6국03-02","국어","5~6","쓰기","적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다.","창작",1],["6국03-03","국어","5~6","쓰기","체험한 일에 대한 감상을 나타내는 글을 쓴다.","창작",1],["6국03-04","국어","5~6","쓰기","독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다.","창작",1],["6국03-05","국어","5~6","쓰기","쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.","창작",1],["6국03-06","국어","5~6","쓰기","쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다.","공유",1],["6국04-01","국어","5~6","문법","음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다.","평가",1],["6국04-02","국어","5~6","문법","표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다.","개념",1],["6국04-03","국어","5~6","문법","고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다.","창작",1],["6국04-04","국어","5~6","문법","문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","개념",1],["6국04-05","국어","5~6","문법","글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다.","창작",1],["6국04-06","국어","5~6","문법","글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다.","개념",1],["6국05-01","국어","5~6","문학","작가의 의도를 생각하며 작품을 읽는다.","맞춤",1],["6국05-02","국어","5~6","문학","비유적 표현의 효과에 유의하여 작품을 감상한다.","개념",1],["6국05-03","국어","5~6","문학","소설이나 극을 읽고 인물, 사건, 배경을 파악한다.","개념",1],["6국05-04","국어","5~6","문학","인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.","개념",1],["6국05-05","국어","5~6","문학","자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다.","창작",1],["6국05-06","국어","5~6","문학","작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다.","평가",1],["6국06-01","국어","5~6","매체","정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.","개념",1],["6국06-02","국어","5~6","매체","뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다.","평가",1],["6국06-03","국어","5~6","매체","적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다.","창작",1],["6국06-04","국어","5~6","매체","자신의 매체 이용 양상에 대해 성찰한다.","평가",1],["2수01-01","수학","1~2","수와 연산","수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다.","개념",0],["2수01-02","수학","1~2","수와 연산","일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다.","개념",0],["2수01-03","수학","1~2","수와 연산","네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다.","탐구",0],["2수01-04","수학","1~2","수와 연산","하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다.","개념",0],["2수01-05","수학","1~2","수와 연산","덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다.","개념",0],["2수01-06","수학","1~2","수와 연산","두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","개념",0],["2수01-07","수학","1~2","수와 연산","덧셈과 뺄셈의 관계를 이해한다.","개념",0],["2수01-08","수학","1~2","수와 연산","두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다.","개념",0],["2수01-09","수학","1~2","수와 연산","□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다.","창작",0],["2수01-10","수학","1~2","수와 연산","곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다.","개념",0],["2수01-11","수학","1~2","수와 연산","곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다.","개념",0],["2수02-01","수학","1~2","변화와 관계","물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다.","창작",0],["2수02-02","수학","1~2","변화와 관계","자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.","개념",0],["2수03-01","수학","1~2","도형과 측정","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.","탐구",0],["2수03-02","수학","1~2","도형과 측정","쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.","창작",0],["2수03-03","수학","1~2","도형과 측정","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.","탐구",0],["2수03-04","수학","1~2","도형과 측정","삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다.","개념",0],["2수03-05","수학","1~2","도형과 측정","삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다.","개념",0],["2수03-06","수학","1~2","도형과 측정","구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다.","탐구",0],["2수03-07","수학","1~2","도형과 측정","시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다.","개념",0],["2수03-08","수학","1~2","도형과 측정","1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다.","창작",0],["2수03-09","수학","1~2","도형과 측정","실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다.","개념",0],["2수03-10","수학","1~2","도형과 측정","길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다.","탐구",0],["2수03-11","수학","1~2","도형과 측정","1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다.","창작",0],["2수03-12","수학","1~2","도형과 측정","여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다.","개념",0],["2수03-13","수학","1~2","도형과 측정","실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다.","개념",0],["2수04-01","수학","1~2","자료와 가능성","여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다.","탐구",0],["2수04-02","수학","1~2","자료와 가능성","자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다.","탐구",0],["2수04-03","수학","1~2","자료와 가능성","자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.","탐구",0],["4수01-01","수학","3~4","수와 연산","큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다.","개념",0],["4수01-02","수학","3~4","수와 연산","다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다.","탐구",0],["4수01-03","수학","3~4","수와 연산","세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","개념",0],["4수01-04","수학","3~4","수와 연산","곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","개념",0],["4수01-05","수학","3~4","수와 연산","나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다.","개념",0],["4수01-06","수학","3~4","수와 연산","나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다.","공유",0],["4수01-07","수학","3~4","수와 연산","나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다.","공유",0],["4수01-08","수학","3~4","수와 연산","자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다.","개념",0],["4수01-09","수학","3~4","수와 연산","양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다.","개념",0],["4수01-10","수학","3~4","수와 연산","단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다.","개념",0],["4수01-11","수학","3~4","수와 연산","분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다.","탐구",0],["4수01-12","수학","3~4","수와 연산","분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다.","개념",0],["4수01-13","수학","3~4","수와 연산","자릿값의 원리를 바탕으로 소수 두 자리 ,"우리 지역의 문화유산","지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.","개념",0],["4사06-02","사회","3~4","우리 지역의 문화유산","지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.","개념",0],["4사07-01","사회","3~4","경제활동과 지역 간 교류","자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.","개념",0],["4사07-02","사회","3~4","경제활동과 지역 간 교류","생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호의존 관계를 맺고 있음을 탐색한다.","개념",0],["4사08-01","사회","3~4","민주주의와 자치","학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.","개념",0],["4사08-02","사회","3~4","민주주의와 자치","지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.","공유",0],["4사09-01","사회","3~4","지역문제를 해결하고 지역을 알리는 노력","생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.","개념",0],["4사09-02","사회","3~4","지역문제를 해결하고 지역을 알리는 노력","지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.","개념",0],["4사10-01","사회","3~4","다양한 환경과 삶의 모습","여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.","탐구",0],["4사10-02","사회","3~4","다양한 환경과 삶의 모습","사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.","탐구",0],["6사01-01","사회","5~6","우리나라 국토 여행","우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.","탐구",0],["6사01-02","사회","5~6","우리나라 국토 여행","독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.","개념",0],["6사02-01","사회","5~6","우리나라 지리 탐구","우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다.","탐구",0],["6사02-02","사회","5~6","우리나라 지리 탐구","우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다.","개념",0],["6사03-01","사회","5~6","법과 인권의 보장","일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.","탐구",0],["6사03-02","사회","5~6","법과 인권의 보장","일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.","공유",0],["6사04-01","사회","5~6","유적과 유물로 살펴본 옛 사람들의 생활","선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활을 추론한다.","탐구",0],["6사04-02","사회","5~6","유적과 유물로 살펴본 옛 사람들의 생활","역사 기록이나 유적과 유물에 나타난 고대 사람들의 생각과 생활을 추론한다.","탐구",0],["6사04-03","사회","5~6","유적과 유물로 살펴본 옛 사람들의 생활","다양한 역사 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 추론한다.","탐구",0],["6사05-01","사회","5~6","달라지는 시대, 변화하는 생활 모습","조선 시대 사람들의 생각과 생활에 유교 문화가 미친 영향을 파악한다.","개념",0],["6사05-02","사회","5~6","달라지는 시대, 변화하는 생활 모습","조선 후기 사회⋅문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 사람들의 생활을 이해한다.","개념",0],["6사06-01","사회","5~6","식민 통치와 저항, 전쟁이 바꾼 사회와 생활","일제의 식민 통치와 이에 대한 저항이 사회와 생활에 미친 영향을 이해한다.","개념",0],["6사06-02","사회","5~6","식민 통치와 저항, 전쟁이 바꾼 사회와 생활","8⋅15 광복과 6⋅25 전쟁이 사회와 생활에 미친 영향을 파악한다.","개념",0],["6사07-01","사회","5~6","평화 통일을 위한 노력, 민주화와 산업화","분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다.","개념",0],["6사07-02","사회","5~6","평화 통일을 위한 노력, 민주화와 산업화","민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다.","개념",0],["6사08-01","사회","5~6","민주주의와 시민 참여","민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다.","공유",0],["6사08-02","사회","5~6","민주주의와 시민 참여","민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립하는 이유를 탐색한다.","개념",0],["6사08-03","사회","5~6","민주주의와 시민 참여","민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다.","탐구",0],["6사09-01","사회","5~6","지구, 대륙 그리고 국가들","세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.","맞춤",0],["6사09-02","사회","5~6","지구, 대륙 그리고 국가들","세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.","공유",0],["6사10-01","사회","5~6","세계의 자연환경","세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다.","개념",0],["6사10-02","사회","5~6","세계의 자연환경","세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다.","탐구",0],["6사11-01","사회","5~6","시장경제와 국가 간 거래","시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다.","개념",0],["6사11-02","사회","5~6","시장경제와 국가 간 거래","경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다.","개념",0],["6사11-03","사회","5~6","시장경제와 국가 간 거래","사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다.","탐구",0],["6사12-01","사회","5~6","지구촌 사람들","세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다.","탐구",0],["6사12-02","사회","5~6","지구촌 사람들","지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색한다.","개념",0],["4과01-01","과학","3~4","힘과 우리 생활","일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다.","탐구",1],["4과01-02","과학","3~4","힘과 우리 생활","수평잡기 활동을 통해 물체의 무게를 비교할 수 있다.","탐구",1],["4과01-03","과학","3~4","힘과 우리 생활","무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다.","탐구",1],["4과01-04","과학","3~4","힘과 우리 생활","지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다.","탐구",1],["4과02-01","과학","3~4","동물의 생활","여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.","탐구",1],["4과02-02","과학","3~4","동물의 생활","다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","탐구",1],["4과02-03","과학","3~4","동물의 생활","동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.","탐구",1],["4과03-01","과학","3~4","식물의 생활","여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.","탐구",1],["4과03-02","과학","3~4","식물의 생활","다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.","탐구",1],["4과03-03","과학","3~4","식물의 생활","식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.","탐구",1],["4과04-01","과학","3~4","생물의 한살이","동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다.","창작",1],["4과04-02","과학","3~4","생물의 한살이","식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다.","탐구",1],["4과04-03","과학","3~4","생물의 한살이","생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다.","창작",1],["4과05-01","과학","3~4","물체와 물질","물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다.","탐구",1],["4과05-02","과학","3~4","물체와 물질","물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다.","탐구",1],["4과05-03","과학","3~4","물체와 물질","다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다.","탐구",1],["4과06-01","과학","3~4","지구와 바다","지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다.","탐구",1],["4과06-02","과학","3~4","지구와 바다","바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.","탐구",1],["4과06-03","과학","3~4","지구와 바다","밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다.","개념",1],["4과07-01","과학","3~4","소리의 성질","여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다.","개념",1],["4과07-02","과학","3~4","소리의 성질","큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다.","개념",1],["4과07-03","과학","3~4","소리의 성질","여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다.","탐구",1],["4과08-01","과학","3~4","감염병과 건강한 생활","생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다.","공유",1],["4과08-02","과학","3~4","감염병과 건강한 생활","감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다.","개념",1],["4과08-03","과학","3~4","감염병과 건강한 생활","건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다.","공유",1],["4과09-01","과학","3~4","자석의 이용","자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다.","탐구",1],["4과09-02","과학","3~4","자석의 이용","자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다.","탐구",1],["4과09-03","과학","3~4","자석의 이용","자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다.","탐구",1],["4과10-01","과학","3~4","물의 상태 변화","물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다.","개념",1],["4과10-02","과학","3~4","물의 상태 변화","물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다.","탐구",1],["4과10-03","과학","3~4","물의 상태 변화","물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다.","탐구",1],["4과11-01","과학","3~4","땅의 변화","흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다.","개념",1],["4과11-02","과학","3~4","땅의 변화","화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다.","창작",1],["4과11-03","과학","3~4","땅의 변화","화성암을 관찰하고 분류할 수 있다.","탐구",1],["4과11-04","과학","3~4","땅의 변화","화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다.","탐구",1],["4과12-01","과학","3~4","다양한 생물과 우리 생활","균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다.","탐구",1],["4과12-02","과학","3~4","다양한 생물과 우리 생활","균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다.","탐구",1],["4과12-03","과학","3~4","다양한 생물과 우리 생활","우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다.","창작",1],["4과13-01","과학","3~4","밤하늘 관찰","달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다.","탐구",1],["4과13-02","과학","3~4","밤하늘 관찰","태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.","탐구",1],["4과13-03","과학","3~4","밤하늘 관찰","별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다.","탐구",1],["4과14-01","과학","3~4","생물과 환경","생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.","탐구",1],["4과14-02","과학","3~4","생물과 환경","생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.","창작",1],["4과14-03","과학","3~4","생물과 환경","인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다.","공유",1],["4과15-01","과학","3~4","여러 가지 기체","실험을 통해 기체가 무게가 있음을 설명할 수 있다.","탐구",1],["4과15-02","과학","3~4","여러 가지 기체","온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.","탐구",1],["4과15-03","과학","3~4","여러 가지 기체","일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다.","탐구",1],["4과15-04","과학","3~4","여러 가지 기체","기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다.","탐구",1],["4과16-01","과학","3~4","기후변화와 우리 생활","기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.","공유",1],["4과16-02","과학","3~4","기후변화와 우리 생활","기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.","개념",1],["4과16-03","과학","3~4","기후변화와 우리 생활","기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다.","탐구",1],["6과01-01","과학","5~6","지층과 화석","지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.","창작",1],["6과01-02","과학","5~6","지층과 화석","지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.","탐구",1],["6과01-03","과학","5~6","지층과 화석","화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다.","탐구",1],["6과02-01","과학","5~6","빛의 성질","물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다.","개념",1],["6과02-02","과학","5~6","빛의 성질","빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.","탐구",1],["6과02-03","과학","5~6","빛의 성질","거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다.","탐구",1],["6과03-01","과학","5~6","용해와 용액","용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.","탐구",1],["6과03-02","과학","5~6","용해와 용액","용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.","탐구",1],["6과03-03","과학","5~6","용해와 용액","일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다.","창작",1],["6과04-01","과학","5~6","우리 몸의 구조와 기능","뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.","창작",1],["6과04-02","과학","5~6","우리 몸의 구조와 기능","소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.","개념",1],["6과04-03","과학","5~6","우리 몸의 구조와 기능","우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다.","탐구",1],["6과05-01","과학","5~6","혼합물의 분리","알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.","개념",1],["6과05-02","과학","5~6","혼합물의 분리","물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다.","개념",1],["6과05-03","과학","5~6","혼합물의 분리","지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다.","탐구",1],["6과06-01","과학","5~6","날씨와 우리 생활","기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.","탐구",1],["6과06-02","과학","5~6","날씨와 우리 생활","이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다.","탐구",1],["6과06-03","과학","5~6","날씨와 우리 생활","고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.","창작",1],["6과07-01","과학","5~6","열과 우리 생활","물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다.","탐구",1],["6과07-02","과학","5~6","열과 우리 생활","온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다.","탐구",1],["6과07-03","과학","5~6","열과 우리 생활","주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.","탐구",1],["6과07-04","과학","5~6","열과 우리 생활","일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다.","탐구",1],["6과08-01","과학","5~6","자원과 에너지","우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다.","탐구",1],["6과08-02","과학","5~6","자원과 에너지","재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.","탐구",1],["6과08-03","과학","5~6","자원과 에너지","자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다.","공유",1],["6과09-01","과학","5~6","산과 염기","여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.","탐구",1],["6과09-02","과학","5~6","산과 염기","산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.","탐구",1],["6과09-03","과학","5~6","산과 염기","우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다.","개념",1],["6과09-04","과학","5~6","산과 염기","산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다.","창작",1],["6과10-01","과학","5~6","물체의 운동","운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.","창작",1],["6과10-02","과학","5~6","물체의 운동","물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.","탐구",1],["6과10-03","과학","5~6","물체의 운동","속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다.","탐구",1],["6과11-01","과학","5~6","식물의 구조와 기능","생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.","탐구",1],["6과11-02","과학","5~6","식물의 구조와 기능","식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.","탐구",1],["6과11-03","과학","5~6","식물의 구조와 기능","여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.","창작",1],["6과12-01","과학","5~6","지구의 운동","하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.","탐구",1],["6과12-02","과학","5~6","지구의 운동","지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.","개념",1],["6과12-03","과학","5~6","지구의 운동","지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.","탐구",1],["6과13-01","과학","5~6","계절의 변화","태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다.","탐구",1],["6과13-02","과학","5~6","계절의 변화","계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다.","탐구",1],["6과13-03","과학","5~6","계절의 변화","계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.","개념",1],["6과14-01","과학","5~6","물질의 연소","물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.","탐구",1],["6과14-02","과학","5~6","물질의 연소","물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.","탐구",1],["6과14-03","과학","5~6","물질의 연소","연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.","탐구",1],["6과14-04","과학","5~6","물질의 연소","연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.","탐구",1],["6과15-01","과학","5~6","전기의 이용","전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.","개념",1],["6과15-02","과학","5~6","전기의 이용","전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.","탐구",1],["6과15-03","과학","5~6","전기의 이용","전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.","창작",1],["6과15-04","과학","5~6","전기의 이용","전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다.","탐구",1],["6과16-01","과학","5~6","과학과 나의 진로","미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.","공유",1],["6과16-02","과학","5~6","과학과 나의 진로","다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.","개념",1],["4영01-01","영어","3~4","이해","알파벳과 쉽고 간단한 단어의 소리를 듣고 식별한다.","개념",0],["4영01-02","영어","3~4","이해","알파벳 대소문자를 식별하여 읽는다.","맞춤",0],["4영01-03","영어","3~4","이해","쉽고 간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다.","개념",0],["4영01-04","영어","3~4","이해","소리와 철자의 관계를 이해하며 쉽고 간단한 단어, 어구, 문장을 소리 내어 읽는다.","맞춤",0],["4영01-05","영어","3~4","이해","쉽고 간단한 단어, 어구, 문장의 의미를 이해한다.","개념",0],["4영01-06","영어","3~4","이해","자기 주변 주제에 관한 담화의 주요 정보를 파악한다.","개념",0],["4영01-07","영어","3~4","이해","적절한 전략을 활용하여 담화나 문장을 듣거나 읽는다.","맞춤",0],["4영01-08","영어","3~4","이해","다양한 매체로 표현된 담화나 문장을 흥미를 가지고 듣거나 읽는다.","맞춤",0],["4영01-09","영어","3~4","이해","시, 노래, 이야기를 공감하며 듣는다.","창작",0],["4영01-10","영어","3~4","이해","자기 주변 주제나 문화에 관한 담화나 문장을 존중의 태도로 듣거나 읽는다.","맞춤",0],["4영02-01","영어","3~4","표현","쉽고 간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 따라 말한다.","개념",0],["4영02-02","영어","3~4","표현","알파벳 대소문자를 구별하여 쓴다.","창작",0],["4영02-03","영어","3~4","표현","소리와 철자의 관계를 바탕으로 쉽고 간단한 단어를 쓴다.","창작",0],["4영02-04","영어","3~4","표현","실물, 그림, 동작 등을 보고 쉽고 간단한 문장으로 말하거나 단어나 어구를 쓴다.","창작",0],["4영02-05","영어","3~4","표현","자신, 주변 사람이나 사물의 소개나 묘사를 쉽고 간단한 문장으로 말하거나 보고 쓴다.","창작",0],["4영02-06","영어","3~4","표현","행동 지시를 쉽고 간단한 문장으로 말하거나 보고 쓴다.","창작",0],["4영02-07","영어","3~4","표현","자신의 감정을 쉽고 간단한 문장으로 말하거나 보고 쓴다.","창작",0],["4영02-08","영어","3~4","표현","자기 주변 주제에 관한 담화의 주요 정보를 묻거나 답한다.","개념",0],["4영02-09","영어","3~4","표현","적절한 매체나 전략을 활용하여 창의적으로 의미를 표현한다.","창작",0],["4영02-10","영어","3~4","표현","의사소통 활동에 흥미와 자신감을 가지고 대화 예절을 지키며 참여한다.","공유",0],["6영01-01","영어","5~6","이해","간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다.","개념",0],["6영01-02","영어","5~6","이해","간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 소리 내어 읽는다.","맞춤",0],["6영01-03","영어","5~6","이해","간단한 단어, 어구, 문장의 의미를 이해한다.","개념",0],["6영01-04","영어","5~6","이해","일상생활 주제에 관한 담화나 글의 세부 정보를 파악한다.","개념",0],["6영01-05","영어","5~6","이해","일상생활 주제에 관한 담화나 글의 중심 내용을 파악한다.","개념",0],["6영01-06","영어","5~6","이해","일상생활 주제에 관한 담화나 글에서 일이나 사건의 순서를 파악한다.","개념",0],["6영01-07","영어","5~6","이해","적절한 전략을 활용하여 일상생활 주제에 관한 담화나 글을 듣거나 읽는다.","맞춤",0],["6영01-08","영어","5~6","이해","다양한 매체로 표현된 담화나 글을 흥미와 자신감을 가지고 듣거나 읽는다.","맞춤",0],["6영01-09","영어","5~6","이해","시, 노래, 이야기를 공감하며 듣거나 읽는다.","맞춤",0],["6영01-10","영어","5~6","이해","일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다.","맞춤",0],["6영02-01","영어","5~6","표현","간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다.","개념",0],["6영02-02","영어","5~6","표현","실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다.","창작",0],["6영02-03","영어","5~6","표현","알파벳 대소문자와 문장 부호를 문장에서 바르게 사용한다.","개념",0],["6영02-04","영어","5~6","표현","주변 사람이나 사물을 간단한 문장으로 소개하거나 묘사한다.","공유",0],["6영02-05","영어","5~6","표현","주변 장소나 위치, 행동 순서나 방법을 간단한 문장으로 설명한다.","개념",0],["6영02-06","영어","5~6","표현","자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다.","창작",0],["6영02-07","영어","5~6","표현","일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다.","개념",0],["6영02-08","영어","5~6","표현","예시문을 참고하여 목적에 맞는 간단한 글을 쓴다.","창작",0],["6영02-09","영어","5~6","표현","적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다.","창작",0],["6영02-10","영어","5~6","표현","의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다.","공유",0],["4도01-01","도덕","3~4","자신과의 관계","자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다.","탐구",1],["4도01-02","도덕","3~4","자신과의 관계","정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다.","개념",1],["4도01-03","도덕","3~4","자신과의 관계","성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다.","개념",1],["4도01-04","도덕","3~4","자신과의 관계","다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다.","개념",1],["4도02-01","도덕","3~4","타인과의 관계","효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다.","개념",1],["4도02-02","도덕","3~4","타인과의 관계","친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.","개념",1],["4도02-03","도덕","3~4","타인과의 관계","공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다.","탐구",1],["4도03-01","도덕","3~4","사회⋅공동체와의 관계","불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다.","탐구",1],["4도03-02","도덕","3~4","사회⋅공동체와의 관계","디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다.","탐구",1],["4도03-03","도덕","3~4","사회⋅공동체와의 관계","통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.","개념",1],["4도04-01","도덕","3~4","자연과의 관계","생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다.","탐구",1],["4도04-02","도덕","3~4","자연과의 관계","인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.","공유",1],["6도01-01","도덕","5~6","자신과의 관계","자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다.","개념",1],["6도01-02","도덕","5~6","자신과의 관계","생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다.","평가",1],["6도01-03","도덕","5~6","자신과의 관계","자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다.","개념",1],["6도02-01","도덕","5~6","타인과의 관계","봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다.","개념",1],["6도02-02","도덕","5~6","타인과의 관계","편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다.","탐구",1],["6도02-03","도덕","5~6","타인과의 관계","인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다.","탐구",1],["6도03-01","도덕","5~6","사회⋅공동체와의 관계","인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다.","개념",1],["6도03-02","도덕","5~6","사회⋅공동체와의 관계","정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안하며 기초적인 시민의식을 기른다.","개념",1],["6도03-03","도덕","5~6","사회⋅공동체와의 관계","통일과정과 통일 이후 사회의 여러 가지 상황을 예상하고 바람직한 통일과정과 통일 국가의 사회상을 제시한다.","개념",1],["6도03-04","도덕","5~6","사회⋅공동체와의 관계","다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다.","탐구",1],["6도04-01","도덕","5~6","자연과의 관계","지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일상에서 실천하고자 노력한다.","개념",1],["6도04-02","도덕","5~6","자연과의 관계","지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다.","탐구",1],["6실01-01","실과","5~6","인간 발달과 주도적 삶","아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다.","개념",1],["6실01-02","실과","5~6","인간 발달과 주도적 삶","건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다.","개념",1],["6실01-03","실과","5~6","인간 발달과 주도적 삶","건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다.","개념",1],["6실01-04","실과","5~6","인간 발달과 주도적 삶","균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다.","개념",1],["6실01-05","실과","5~6","인간 발달과 주도적 삶","옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다.","개념",1],["6실01-06","실과","5~6","인간 발달과 주도적 삶","가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다.","개념",1],["6실01-07","실과","5~6","인간 발달과 주도적 삶","직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다.","개념",1],["6실02-01","실과","5~6","생활환경과 지속가능한 선택","시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높이는 방법을 탐색한다.","개념",1],["6실02-02","실과","5~6","생활환경과 지속가능한 선택","생활자원 관리의 필요성을 인식하고, 생활자원의 합리적인 보관과 활용방법을 익힌다.","맞춤",1],["6실02-03","실과","5~6","생활환경과 지속가능한 선택","생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다.","개념",1],["6실02-04","실과","5~6","생활환경과 지속가능한 선택","식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다.","개념",1],["6실02-05","실과","5~6","생활환경과 지속가능한 선택","음식의 조리과정을 체험하여 자기 간식이나 식사를 스스로 마련하는 식생활을 실천한다.","개념",1],["6실02-06","실과","5~6","생활환경과 지속가능한 선택","우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사 예절을 실천한다.","공유",1],["6실02-07","실과","5~6","생활환경과 지속가능한 선택","의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명한다.","창작",1],["6실02-08","실과","5~6","생활환경과 지속가능한 선택","다양한 도구와 재료를 활용하여 간단한 생활용품을 만들어 보면서 직접 만들어 쓰는 즐거움과 창의적 태도를 가진다.","창작",1],["6실02-09","실과","5~6","생활환경과 지속가능한 선택","간단한 옷의 수선 등 의생활과 관련된 문제를 스스로 해결하려는 태도를 가진다.","개념",1],["6실02-10","실과","5~6","생활환경과 지속가능한 선택","자신의 생활공간을 쾌적하고 위생적으로 관리하는 것의 중요성을 알고, 정리정돈과 청소 및 쓰레기 처리의 방법을 익혀 실천한다.","맞춤",1],["6실02-11","실과","5~6","생활환경과 지속가능한 선택","생태 지향적 삶을 위해 자신의 의식주 생활에서 할 수 있는 구체적인 행동을 계획하여 실천한다.","개념",1],["6실03-01","실과","5~6","기술적 문제해결과 혁신","발명의 의미를 이해하고, 일상생활을 바꾼 발명품을 탐색하여 발명과 기술에 대한 중요성과 가치를 인식한다.","개념",1],["6실03-02","실과","5~6","기술적 문제해결과 혁신","발명사고기법과 기술적 문제 해결 과정을 이해하고, 다양한 재료를 활용하여 생활 속 문제를 해결할 수 있는 창의적인 제품을 구상하고 만들어 봄으로써 실천적 태도를 갖는다.","창작",1],["6실03-03","실과","5~6","기술적 문제해결과 혁신","발명과 특허의 관계를 이해하고, 특허 침해 사례를 통하여 지식재산권의 중요성을 인식하여 올바른 방법으로 활용한다.","개념",1],["6실03-04","실과","5~6","기술적 문제해결과 혁신","수송의 의미와 수송 수단의 발달과정에 대한 이해를 바탕으로 생활 속 다양한 수송 수단을 탐색한다.","개념",1],["6실03-05","실과","5~6","기술적 문제해결과 혁신","수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다.","창작",1],["6실04-01","실과","5~6","지속가능한 기술과 융합","친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험하면서 건설기술에 대한 가치를 인식한다.","개념",1],["6실04-02","실과","5~6","지속가능한 기술과 융합","생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다.","창작",1],["6실04-03","실과","5~6","지속가능한 기술과 융합","제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다.","창작",1],["6실04-04","실과","5~6","지속가능한 기술과 융합","로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다.","개념",1],["6실04-05","실과","5~6","지속가능한 기술과 융합","로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다.","개념",1],["6실04-06","실과","5~6","지속가능한 기술과 융합","로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작시키는 체험을 통해 융합 기술의 가치를 인식하다.","창작",1],["6실04-07","실과","5~6","지속가능한 기술과 융합","생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색한다.","탐구",1],["6실04-08","실과","5~6","지속가능한 기술과 융합","생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태 존중감을 가진다.","개념",1],["6실04-09","실과","5~6","지속가능한 기술과 융합","동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다.","개념",1],["6실04-10","실과","5~6","지속가능한 기술과 융합","생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다.","탐구",1],["6실04-11","실과","5~6","지속가능한 기술과 융합","농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다.","개념",1],["6실05-01","실과","5~6","디지털 사회와 인공지능","컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다.","창작",1],["6실05-02","실과","5~6","디지털 사회와 인공지능","컴퓨터에게 명령하는 방법을 체험하고, 주어진 문제를 해결하는 프로그램을 작성한다.","개념",1],["6실05-03","실과","5~6","디지털 사회와 인공지능","실생활의 문제를 해결하는 프로그램을 협력하여 작성하고, 산출물을 타인과 공유한다.","공유",1],["6실05-04","실과","5~6","디지털 사회와 인공지능","디지털 데이터와 아날로그 데이터의 특징을 이해하고, 인공지능에 활용할 수 있는 데이터의 유형이나 형태를 탐색한다.","개념",1],["6실05-05","실과","5~6","디지털 사회와 인공지능","인공지능이 만들어지는 과정을 체험하고, 인공지능이 사회에 미치는 영향을 탐색한다.","창작",1],["4체01-01","체육","3~4","운동","운동과 체력의 의미를 이해하고 관계를 파악한다.","개념",1],["4체01-02","체육","3~4","운동","기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.","개념",1],["4체01-03","체육","3~4","운동","운동과 건강의 의미를 이해하고 관계를 파악한다.","개념",1],["4체01-04","체육","3~4","운동","건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.","개념",1],["4체01-05","체육","3~4","운동","자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다.","개념",1],["4체01-06","체육","3~4","운동","운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","개념",1],["4체02-01","체육","3~4","스포츠","스포츠의 의미와 유형을 파악한다.","개념",1],["4체02-02","체육","3~4","스포츠","기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","개념",1],["4체02-03","체육","3~4","스포츠","움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다.","개념",1],["4체02-04","체육","3~4","스포츠","기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다.","개념",1],["4체02-05","체육","3~4","스포츠","기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","개념",1],["4체02-06","체육","3~4","스포츠","전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","개념",1],["4체02-07","체육","3~4","스포츠","생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","개념",1],["4체02-08","체육","3~4","스포츠","움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다.","개념",1],["4체02-09","체육","3~4","스포츠","게임 활동에 최선을 다하고 규칙을 지킨다.","개념",1],["4체02-10","체육","3~4","스포츠","다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여한다.","공유",1],["4체03-01","체육","3~4","표현","표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다.","개념",1],["4체03-02","체육","3~4","표현","움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다.","개념",1],["4체0
