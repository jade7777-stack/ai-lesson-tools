const CUR_NOTE={"2국01-02":"이 성취기준은 대화를 나눌 때 자신의 감정을 적절하게 표현함으로써 타인과의 관계를 형성하고 유지하며 발전시키는 능력을 기르기 위해 설정하였다. 기쁨, 슬픔, 사랑, 미움 등 다양한 감정과 관련된 표현 알기, 감정을 표현하는 과정에서 바르고 고운 말을 사용하기, 상대의 감정을 이해하고 수용하기 등을 학습한다.","2국01-03":"이 성취기준은 구어 의사소통의 상호 교섭성을 인식하는 출발점으로, 대화 상황에서 상대의 말에 집중하여 그 내용을 이해하고 순서를 교대하며 구어 의사소통에 참여하는 기본 능력을 기르기 위해 설정하였다. 상대의 말을 집중하여 듣기, 다음 말할 사람을 선택하여 다음 말할 사람을 선택하여 부르거나, 고갯짓, 시선, 억양 등의 말차례 교환 신호를 활용하여 다음 사람이 말차례를 알아차릴 수 있도록 하기, 말차례 교환 신호를 확인하여 자신의 말차례 지키기 등을 학습한다.","2국01-04":"이 성취기준은 교실에서 자신의 경험이나 생각을 바른 자세로 표현하고 학습에 참여할 수 있는 기본 능력을 기르기 위해 설정하였다. 자신의 경험이나 생각을 동료 학습자들 앞에서 간단히 말하기, 자신의 경험이나 배경지식을 바탕으로 말하기, 수업 시간에 바른 자세로 서서 말하기, 듣는 사람을 바라보며 말하기, 적절한 크기의 소리로 말하기 등을 학습한다.","2국01-05":"이 성취기준은 삶에서 듣기⋅말하기의 즐거움을 느끼고 듣기⋅말하기의 중요성을 인식하도록 하기 위해 설정하였다. 듣기⋅말하기가 다양한 생각과 감정을 나누며 의사소통하기 위한 기본적인 도구임을 인식하기, 듣기⋅말하기의 역할과 중요성을 직접 경험해 보기, 다양한 놀이를 통해 듣기⋅말하기에 흥미 가지기 등을 학습한다.","2국02-02":"이 성취기준은 글을 의미 단위에 알맞게 띄어 읽으며 글의 의미를 파악하는 능력을 기르기 위해 설정하였다. 글을 읽으면서 의미 단위를 인식하고 이에 맞게 띄어 읽는 것은 글의 의미를 정확하게 파악하고 읽기 유창성을 높이는 데 중요한 요소이다. 글의 의미를 이해하기 위해 의미 단위에 따른 어구나 어절 단위 등으로 띄어 읽기, 주어부와 서술어부 등을 단위로 하여 띄어 읽기, 문장 부호에 따라 문장 단위를 인식하면서 띄어 읽기, 쉬는 지점, 쉼의 길이에 유의하며 띄어 읽기 등을 학습한다.","2국02-04":"이 성취기준은 글에 등장하는 인물의 마음과 생각을 짐작하는 능력과 타인에 대한 공감 능력을 기르기 위해 설정하였다. 인물의 마음이나 생각을 짐작하는 것은 글의 내용에 대한 이해와 더불어 실제 주변 인물에 대한 이해를 높이는 데 도움이 된다. 인물의 처지나 상황을 파악하기, 자신의 경험에 비추어 인물의 마음이나 생각 짐작하기, 감정을 드러내는 다양한 어휘를 활용하여 인물의 마음이나 생각을 표현하기, 인물의 마음이나 생각과 관련된 자신의 경험이나 생각을 떠올리며 비교하기 등을 학습한다.","2국03-02":"이 성취기준은 쓰기에 흥미를 가지고 자신의 생각이나 느낌을 문장으로 표현하는 능력을 기르기 위해 설정하였다. 쓰기에 대한 긍정적인 인식을 가지고 문장 쓰기를 수행하는 것은 필자로 성장하기 위한 출발점에 해당한다. 자신의 생각이나 느낌을 문장으로 구성하는 방법, 꾸며 주는 말을 넣어 자신의 생각이나 느낌을 표현하는 방법 등을 학습한다. 이를 통해 학습자가 자신이 쓰고 싶은 화제나 주제를 찾아 다양한 문장으로 표현하는 즐거움을 경험하도록 한다.","2국03-04":"이 성취기준은 자신이 겪은 일을 내용이나 형식에 제한 없이 자유롭게 표현하고, 그 과정과 결과를 독자와 공유하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 자신이 겪은 일 중 글로 쓰고 싶은 경험 떠올리기, 경험에 대한 자신의 생각이나 느낌 떠올리기, 자유롭게 표현하기, 쓴 글을 함께 읽고 반응하기 등을 학습한다.","2국04-03":"이 성취기준은 문장으로 의사소통하기 위해 필요한 기초적인 문식성을 기르고, 글자, 단어, 문장을 주의 깊게 관찰하고 탐구하는 자세를 기르기 위해 설정하였다. 자신의 생각을 문장으로 쓰는 것은 의사소통 능력의 핵심으로서, 특히 한글 학습 초기에는 음성 언어와는 다른 문자 언어의 특성을 이해하는 것이 중요하다. 문장 부호의 이름과 쓰임, 평서문⋅의문문⋅감탄문 등 다양한 종류의 문장 쓰기와 그에 따른 문장 부호 사용하기를 다루되, 문장 부호 사용의 필요성을 깨닫고 문장을 비롯하여 문장을 이루는 글자, 단어에도 호기심을 갖도록 한다.","2국05-01":"이 성취기준은 흥미로운 말놀이와 분위기를 살린 낭송을 통해 언어 활동의 재미와 즐거움을 느끼며 언어적 감수성을 기르게 하기 위해 설정하였다. 일상에서 쉽게 접할 수 있는 작품은 물론 일상적 대화 등을 통해 언어의 놀이적 성격을 인지하도록 하고, 의성어와 의태어, 규칙적으로 반복되는 소리, 언어유희, 재치 있는 문답, 수수께끼, 끝말잇기 등에서 말놀이의 재미와 가치를 느끼게 한다. 또한 작품의 느낌과 분위기를 살려 낭송해 보면서 목소리 크기나 말의 속도, 어조 등을 달리함에 따라 다양한 느낌을 전달할 수 있음을 알고 문학을 즐겨 향유하도록 한다.","2국05-02":"이 성취기준은 학습자들이 작품에 대해 느끼거나 생각한 점을 다른 이들과 나누는 과정에서 문학에 대해 더욱 흥미를 느끼고, 주체적으로 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 학습자의 발달과 정서적 측면을 고려하여 시, 노래, 이야기 등 다양한 갈래의 작품을 제시하고, 학습자가 이들 작품을 대상으로 자신의 생각이나 느낌을 표현할 수 있도록 한다. 이 과정에서 학습자로 하여금 작품에 대한 다른 학습자들의 말을 경청하게 하고, 사람마다 작품을 다르게 받아들일 수 있다는 점을 이해하게 한다.","2국06-01":"이 성취기준은 매체와 관련된 일상 경험을 나눔으로써 매체와 매체 자료에 대한 흥미와 관심을 가지고 매체의 가치와 필요성을 자연스럽게 인식하도록 하기 위해 설정하였다. 매체란 소통을 매개하는 도구, 기술, 환경으로, 책, TV, 스마트폰, 컴퓨터, 태블릿, 인터넷 등이 이에 속하며, 매체 자료에는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화 등이 있다. 이 성취기준에서는 학습자가 친숙한 매체와 매체 자료를 토대로 일상의 경험을 매체와 연결 지어 이야기하여 매체와 매체 자료의 개념과 쓰임을 이해하고 다양한 매체와 매체 자료에 흥미와 관심을 갖도록 한다.","2국06-02":"이 성취기준은 글과 그림으로 자신의 생각과 느낌을 표현하는 즐거움을 경험하도록 하기 위해 설정하였다. 글, 그림(또는 사진, 이모티콘 등)을 활용하여 자신, 친구, 가족, 학교, 교실 등 친숙한 주제에 대해 표현하거나 그림일기를 작성해 보는 활동을 통해 자신의 경험과 생각을 다양한 방식으로 표현해 보는 데 중점을 둔다.","4국01-03":"이 성취기준은 구어 의사소통 상황에서 억양, 어조, 속도 등의 준언어적 표현과 표정, 시선, 몸동작, 자세 등의 비언어적 표현을 활용하여 의미를 효과적으로 전달하고 이해할 수 있는 능력을 기르기 위해 설정하였다. 다양한 상황에 알맞은 준언어⋅비언어적 표현의 중요성 이해하기, 준언어⋅비언어적 표현의 의미와 효과 파악하기, 준언어⋅비언어적 표현의 적절성 점검하기, 상황에 적절한 준언어⋅비언어적 표현 활용하기 등을 학습한다.","4국01-05":"이 성취기준은 교과 학습 상황을 비롯하여 다양한 상황에서 필요한 기초적인 발표 능력을 기르기 위해 설정하였다. 주어진 자료에서 발표 목적과 주제에 알맞은 내용을 중심으로 발표 내용 정리하기, 준비한 내용이 명확하게 전달되는지를 점검하며 발표 연습하기, 준언어⋅비언어적 표현을 효과적으로 사용하는지 점검하며 발표 연습하기, 연습 과정에서 부족했던 부분을 조정하여 자신감을 가지고 발표하기 등을 학습한다.","4국01-06":"이 성취기준은 문제를 합리적으로 해결하기 위한 기초 능력으로서 토의 능력을 기르기 위해 설정하였다. 주제에 적절한 의견을 이유와 함께 제시하기, 상대의 의견을 구체적으로 파악하거나 의견과 이유의 적절성을 점검하기 위해 서로 묻고 답하기, 다른 사람의 생각 존중하기 등을 학습한다.","4국02-01":"이 성취기준은 글의 의미를 효과적으로 표현하는 방법을 사용하여 유창하게 글을 읽는 능력을 기르기 위해 설정하였다. 글의 유형에 따라 글의 분위기, 장면, 인물의 특성 등을 파악하고 이를 고려하되, 어조, 억양, 속도, 강세 등의 표현 요소를 활용하여 글을 읽으면서 글의 의미를 효과적으로 표현하기 등을 학습한다.","4국02-03":"이 성취기준은 글을 읽으며 글에 대한 질문을 만들고 이에 대한 답을 예측하면서 글을 읽는 추론적 읽기 능력을 기르기 위해 설정하였다. 읽기 전이나 읽기 중에 이루어지는 질문을 통해 자신의 배경지식이나 경험을 글과 관련짓기, 배경지식이나 경험을 활성화하여 글의 의미 추론하기, 제목이나 글의 차례, 사진이나 그림 등의 자료를 통해 글의 의미 추론하기, 질문을 통해 단어의 의미, 이어질 내용이나 사건의 전후를 예측하기, 질문을 통해 글을 이해한 정도를 점검하거나 읽기 과정에서 겪는 어려움을 점검하기 등을 학습한다.","4국02-04":"이 성취기준은 글에 나타난 사실과 의견을 구별하고 필자와 자신의 의견을 비교하면서 필자의 의견을 일방적으로 수용하지 않고 글을 비판적으로 읽는 능력을 기르기 위해 설정하였다. 글을 읽고 필자의 의견과 객관적 사실을 구별하기, 필자의 의견과 자신의 의견을 비교하기, 필자의 의견에 대한 타당성을 평가하기, 동일한 주제나 상황에 대한 서로 다른 의견 비교하기 등을 학습한다.","4국02-05":"이 성취기준은 도서관이나 인터넷 등을 통해 글이나 자료를 찾아 읽을 때 출처의 신뢰성을 평가하며 읽고 믿을 만한 글이나 자료를 선별하는 능력을 기르기 위해 설정하였다. 글이나 자료의 출처 확인 방법이나 필요성 이해하기, 다양한 매체를 활용하여 글이나 자료 탐색하기, 글이나 자료의 정보 출처 파악하기, 정보 출처의 유형이나 정보의 최신성 확인하기, 권위나 공신력 등을 고려한 신뢰성 평가하기, 여러 정보를 비교하며 내용의 신뢰성 평가하기 등을 학습한다.","4국03-01":"이 성취기준은 문단을 짜임새 있게 쓰는 능력을 길러 글을 쓰는 과정에서 이를 적용할 수 있도록 하기 위해 설정하였다. 문단의 개념, 문단의 기능과 역할, 중심 문장과 뒷받침 문장의 관계, 중심 문장과 뒷받침 문장을 쓰는 방법, 중심 문장과 뒷받침 문장을 갖추어 문단을 쓰는 방법, 문장과 문단을 중심으로 글을 고쳐 쓰는 방법 등을 학습한다.","4국03-02":"이 성취기준은 교과 학습의 기초가 되는 보고하는 글을 쓰는 능력을 기르기 위해 설정하였다. 보고하는 글의 개념, 보고하는 글에 들어가야 할 내용 요소, 절차와 결과가 드러나게 글의 내용을 조직하는 방법, 절차와 결과를 정확하게 표현해야 하는 이유, 정확한 표현으로 보고하는 글 쓰기 등을 학습한다.","4국03-03":"이 성취기준은 어떤 대상이나 사실, 문제에 대한 자신의 의견을 구체적이고 명료하게 글로 쓰는 능력을 기르기 위해 설정하였다. 의견의 개념, 의견을 제시하는 것이 필요한 이유와 상황, 주제를 고려하여 자신의 의견을 제시하는 방법, 의견에 대한 이유를 드는 방법 등을 학습한다.","4국04-02":"이 성취기준은 단어에 대한 기본적인 이해를 바탕으로 국어사전에서 단어를 찾고 국어사전에 수록된 정보를 활용하여 능동적인 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 명사, 동사, 형용사에 대한 기본적인 이해를 바탕으로 하되, 상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 동형이의어와 다의어가 국어사전에 수록된 방식을 이해하고, 동사와 형용사의 기본형과 활용형을 구분할 수 있도록 한다. 또한 국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해하고, 단어의 정확한 발음과 표기를 국어사전에서 찾아 어법에 맞는 국어생활을 할 수 있도록 한다.","4국04-04":"이 성취기준은 높임 표현과 지시⋅접속 표현이 상황 맥락에 맞는 언어 표현을 선택하거나 글이나 담화를 유기적으로 구성하는 데 필요한 지식임을 이해하고, 글이나 담화에서 높임 표현과 지시⋅접속 표현을 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 높임 표현의 기능과 적절한 사용 방식, 앞에 나온 말을 가리키는 지시 표현 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다.","4국05-01":"이 성취기준은 문학 작품 속 인물의 특성과 서사의 기본 구조를 파악하며 작품을 이해하는 능력을 기르게 하기 위해 설정하였다. 이야기를 읽을 때 인물의 성격과 역할을 파악하고, 이를 고려하여 시간적 순서나 인과관계를 생각하며 이야기의 흐름을 파악하는 활동에 중점을 둔다. 나아가 작품 속 다양한 인물의 특성을 고려하면서 이어질 이야기를 상상하여 표현해 봄으로써 작품을 능동적으로 이해하고 감상하게 한다.","4국05-02":"이 성취기준은 작품 속의 세계가 현실 세계를 반영한 것이지만, 허구적 세계로서 현실 세계와 구별된다는 점을 인식하며 작품을 감상할 수 있게 하기 위해 설정하였다. 작품 속의 인물⋅정서⋅상황⋅배경⋅분위기⋅사건 등을 이해할 때 학습자 자신의 경험을 바탕으로 경험과 상상, 사실과 허구를 비교하며 생각하게 하고, 허구적으로 표현한 부분에 대한 의견을 나누며 작품을 감상하도록 한다.","4국05-04":"이 성취기준은 문학 표현 방식의 효과와 기능을 이해하며 작품을 감상하고, 자신의 생각이나 느낌을 다양한 방법으로 나타내어 다른 이들과 나누게 하기 위해 설정하였다. 학습자로 하여금 감각적 표현을 통해 작품 속에 형상화된 대상을 생동감 있게 체험하면서 문학의 즐거움을 느끼게 하는 데 중점을 둔다. 또한 자신의 생각과 감정을 효과적으로 전달할 수 있는 감각적 표현을 활용하여 말을 하거나 글을 써 보고 감각적 표현을 사용하였을 때와 그렇지 않을 때의 차이를 비교하게 한다.","4국06-01":"이 성취기준은 다양한 교과 학습 맥락에서 인터넷에 접속하여 다양한 자료에 효과적으로 접근하고 유용한 정보를 선택하여 목적에 맞게 활용할 때 필요한 기초 능력을 기르기 위해 설정하였다. 교사의 안내에 따라 디지털 매체를 통해 지정된 인터넷 공간에 접속하기, 다양한 자료 훑어보기, 자료의 내용 파악하기, 유용한 자료 선택하기 등을 수행하고, 이를 통해 인터넷 접속 방법, 비선형적 자료의 탐색 방법, 목적에 맞는 정보 선택 방법 등을 체계적으로 학습한다.","4국06-03":"이 성취기준은 매체 기반의 소통에서 지켜야 할 기본적인 윤리를 이해하고 이를 고려하며 매체 자료를 활용하거나 공유할 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 자료를 활용하거나 공유하는 과정에서 저작권과 초상권 침해, 개인 정보 유출 등의 문제가 발생할 수 있음을 이해한다. 다양한 사례를 통해 매체 이용자로서 소통 윤리를 지키려는 태도를 기르고, 매체 자료를 안전하고 올바르게 활용하고 공유할 수 있는 방법 등을 학습한다.","6국01-03":"이 성취기준은 교과 학습 상황을 비롯한 다양한 상황에서 주제와 관련하여 적극적으로 질문하며 구어 의사소통에 참여하는 능력을 기르기 위해 설정하였다. 들은 내용을 확인하거나 명료하게 이해하기 위한 질문, 생략된 내용을 추론하기 위한 질문, 상대의 의도를 파악하기 위한 질문, 다른 사람의 생각과 자신의 생각을 연결하기 위한 질문, 자료에서 제시되지 않은 대안이나 더 많은 정보를 찾기 위한 질문 등 다양한 목적으로 질문 생성하기, 분명한 표현으로 질문하기, 예절을 지켜 질문하기 등을 학습한다.","6국01-04":"이 성취기준은 일련의 절차에 따라 면담을 경험해 봄으로써 정보 수집 등의 목적을 가진 구어 의사소통을 효과적이고 체계적으로 수행하는 능력을 기르기 위해 설정하였다. 면담 준비⋅진행⋅결과 정리 등 면담의 절차 이해하기, 면담의 목적⋅대상⋅주제 등 설정하기, 사전 정보 수집하기, 면담 대상 섭외하기, 목적⋅대상⋅주제에 알맞은 질문 준비하기, 녹음기나 기록용 노트 등 면담에 필요한 매체 준비하기, 준비한 질문을 바탕으로 면담하기, 면담 결과를 발표하거나 글로 써서 보고하기 등을 학습한다. 면담 상대를 배려하여 사전에 약속 시간 정하기, 녹음 여부에 대해 동의 구하기, 민감하거나 불편한 질문은 아닌지 점검하기, 종료 후 감사 표현하기 등 면담 과정에서 지켜야 할 예절도 학습한다.","6국01-07":"이 성취기준은 민주적 의사소통 능력으로서 토론 능력을 기르기 위해 설정하였다. 찬성 또는 반대의 입장에서 주장하는 바에 대한 이유 마련하기, 이유를 뒷받침할 수 있는 객관적인 사실 또는 정보를 활용하여 근거 마련하기, 주장이 가치 있고 실천 가능한지 검토하기, 이유가 주장과 관련이 있는지 검토하기, 이유가 상대에게 받아들여질 수 있는지 검토하기, 근거가 이유와 관련이 있는지 검토하기, 근거로 제시한 자료의 출처가 명확하고 믿을 만한지 검토하기, 상대의 의견을 존중하며 토론하기, 절차와 규칙에 따라 합리적으로 소통하는 태도 형성하기 등을 학습한다.","6국02-01":"이 성취기준은 글의 구조를 고려하며 글의 중심 내용을 파악하고 자신의 언어로 요약하는 능력을 기르기 위해 설정하였다. 요약하기의 일반 원리를 이해하기, 글의 구조를 시각화한 도해 조직자를 활용하여 글의 구조와 내용 파악하기, 주제나 주장을 파악하기, 글의 중심 내용을 자신의 언어로 재구성하여 요약하기 등을 학습한다.","6국02-02":"이 성취기준은 글의 문맥을 고려하여 글에 표면적으로 드러나지 않은 내용을 추론하며 읽는 능력을 기르기 위해 설정하였다. 중요 단어나 문장, 문단 등의 수준에서 의미 추론하기, 글의 전체적인 흐름을 고려할 때 글에서 빠진 세부 내용이나 이어질 내용 추론하기, 학습자의 배경지식을 이용하여 함축적 표현이 암시하거나 내포하는 의미 추측하기 등을 학습한다.","6국02-04":"이 성취기준은 학습자가 직면한 문제를 해결하기 위해 다양한 관점의 글을 찾아 읽고 문제 해결에 필요한 지식이나 정보를 구성하는 창의적 읽기 능력을 기르기 위해 설정하였다. 문제 상황과 관련한 읽기 목적 명료화하기, 문제 상황 해결에 도움을 줄 수 있는 다양한 관점의 글 선정하기, 다양한 관점의 글을 읽고 내용의 타당성과 유용성 평가하기, 문제 해결을 위한 자신만의 창의적인 해결 방안 마련하기 등을 학습한다.","6국03-01":"이 성취기준은 설명하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 설명하고자 하는 대상의 특성을 드러낼 수 있는 내용을 선정하는 방법, 개념 정의, 부연 상술, 예시, 열거, 인용, 비교와 대조 등을 활용하여 독자가 대상의 특성을 이해하기 쉽게 내용을 구성하고 표현하는 방법, 설명 대상과 설명 방법의 관련성 등을 학습한다. 설명 대상은 인문, 사회, 과학, 예술, 체육 등 교과 내용에서 선정한다.","6국03-02":"이 성취기준은 주장하는 글을 쓰는 데에 필요한 능력과 쓰기 윤리를 준수하며 글을 쓰는 태도를 기르기 위해 설정하였다. 주장하는 글 쓰기의 중요성과 특성, 주장과 이유 및 근거의 개념과 관계, 주장하는 글에 적절한 근거가 필요한 까닭, 역사적 사실, 실험 및 조사 결과, 통계 수치, 전문가의 견해 등을 활용하여 근거 생성하기, 이유와 근거를 활용하여 주장하는 글 쓰기, 인용의 출처를 밝혀야 하는 이유와 기본적인 인용 방법 등을 학습한다.","6국03-04":"이 성취기준은 글을 쓰는 과정에서 쓰기 목적, 독자와 매체 등과 같은 상황 맥락을 고려하여 내용을 생성하고 표현하는 능력을 기르기 위해 설정하였다. 예상 독자의 개념 이해하기, 독자 고려의 필요성 인식하기, 온라인 대화, 인터넷 게시판 댓글, 전자 우편, 블로그, 휴대전화 문자 메시지 등 다양한 매체의 특성 이해하기, 글의 목적이나 주제에 따라 알맞은 매체와 예상 독자 선정하기, 독자와 매체의 특성을 고려하여 계획 및 내용 생성하기, 독자와 매체의 특성을 고려하여 표현하기 등을 학습한다.","6국03-05":"이 성취기준은 필자가 자신의 쓰기 과정을 점검⋅조정하고 그 결과를 바탕으로 글을 고쳐 쓰는 능력을 기르기 위해 설정하였다. 글쓰기에서 통일성의 개념과 중요성, 쓰기 과정에 대한 점검과 조정의 필요성, 쓰기 과정의 회귀적 특성, 글에 대한 독자의 반응을 생각하며 고쳐쓰기, 글의 주제와 목적, 예상 독자 등을 고려하여 글의 통일성 점검하기 등을 학습한다.","6국04-01":"이 성취기준은 생각을 표현하는 언어 양식으로서 음성 언어와 문자 언어의 특성을 이해하고, 매체 자료에서 생성된 음성 언어 및 문자 언어의 표현 효과를 평가하는 능력을 기르기 위해 설정하였다. 음성 언어 및 문자 언어의 특성을 비교하되, 복합양식적 특성을 지니는 다양한 매체 자료에 사용된 언어 양식의 표현 효과를 학습하고, 표현하고자 하는 목적이나 핵심 주제가 같더라도 언어 양식이 다르면 전달되는 내용과 표현 효과가 다를 수 있음을 분석적, 비판적 시각으로 이해하고 평가할 수 있도록 한다.","6국04-02":"이 성취기준은 국어 화자의 의사소통에서 표준어와 방언이 담당하는 기능이 다르다는 점을 알고, 자신이 속한 언어 공동체 특유의 한국어 변이형들로 인해 자신의 국어생활이 상황에 따라 다양하게 실현됨을 이해하도록 하기 위해 설정하였다. 방언의 형성과 존재 양상을 파악함으로써 지역적 요인에 따라 자연스럽게 한국어에 변이가 일어남을 이해하도록 하고, 이러한 다양성을 아우르는 언어 공동체 규준인 표준어의 개념과 필요성을 함께 다루도록 한다. 또한 의사소통의 공적⋅사적 상황에 따라, 상대방과의 거리감 조절 등 화자의 의도에 따라 표준어와 방언을 선택함으로써 다양한 의사소통 기능이 실현된다는 점을 확인할 수 있도록 한다.","6국04-03":"이 성취기준은 고유어와 관용 표현의 쓰임과 가치를 이해하고 국어문화에 대한 관심과 우리말을 소중히 여기는 태도를 고양하기 위해 설정하였다. 한자어, 외래어와 함께 국어 어휘의 일부를 이루는 고유어의 특성과 가치, 고유어에 다양하게 발달해 있는 관용 표현의 특성과 쓰임에 대한 이해에 중점을 두되, 상황과 표현 의도에 따라 어휘를 적절하게 사용하고 외래어의 오⋅남용 방지 등 국어 순화의 필요성을 자각하며 실천할 수 있도록 한다.","6국04-04":"이 성취기준은 문장을 구성하는 성분들 사이의 호응 관계가 올바르고 자연스러운 문장을 구성하는 데 필요한 능력을 기르기 위해 설정하였다. 문장에서 주어, 목적어, 서술어의 역할, 성분 간의 호응 관계(주어와 서술어의 호응, 목적어와 서술어의 호응)에 대해 학습하고, 이전 학년군의 높임 표현 및 동일 학년군의 시간 표현 성취기준과 연계하여 높임이나 시제의 일치를 함께 학습할 수 있다.","6국04-05":"이 성취기준은 효과적인 의사소통을 위해 상황 맥락에 맞게 시간 표현을 사용하는 것의 중요성을 알고 시간을 표현할 때 사용되는 언어 형식을 이해하고 활용하는 능력을 기르기 위해 설정하였다. ‘-았-/-었-, -는-/-ㄴ-, -겠-, -(으)ㄹ 것이-’나 시간 부사 등 글이나 담화에서 과거, 현재, 미래를 표현하는 언어 형식 및 방법을 학습하고, 다양한 상황 맥락에서 시간 표현을 사용한 후 그 적절성을 평가해 보도록 한다.","6국05-01":"이 성취기준은 작품을 만든 이에 대해 호기심을 가지고 작가라는 존재를 고려하면서 작품을 수용하는 능력을 기르게 하기 위해 설정하였다. 작가가 작품을 쓰게 된 계기나 상황을 생각하고, 작가의 취지와 의도를 헤아리면서 작품을 더 깊고 넓게 이해할 수 있게 한다. 또한 작가에 대한 관심을 바탕으로 작가의 다른 작품들도 찾아 읽는 태도를 가지며 능동적인 문학 향유자로 성장할 수 있게 한다. 아울러 다양한 상상의 세계를 펼쳐 보이는 창의성을 가진 인간에게 관심을 가짐으로써 학습자도 그러한 창의성을 가진 인간으로 성장하는 계기가 될 수 있게 한다. 다만 작품의 의미는 작가의 의도에 한정되는 것이 아니며, 다양한 독자들의 해석이 더해져서 계속 생성되어 가는 것이라는 점을 함께 생각하며 문학 소통에 적극적으로 참여할 수 있게 한다.","6국05-03":"이 성취기준은 작품을 이루는 주요 요소를 중심으로 작품을 분석하고 이해하는 능력을 기르게 하기 위해 설정하였다. 작품 속 인물, 사건, 배경을 파악하고, 각 요소의 기능 및 요소 간 관계를 이해하도록 한다. 예를 들어 인물의 성격과 사건의 전개 과정 간의 관계, 인물의 성격이 사건 전개 과정에 끼치는 영향, 사건의 전개 과정과 배경과의 관련, 배경의 변화에 따른 사건 전개 과정의 변화 등을 파악하여 작품을 깊이 있게 감상한다. 나아가 이러한 요소의 역할이나 관계가 모든 작품에서 동일한 양상으로 나타나는 것이 아니며, 작품에 따라 특정 요소가 두드러지게 부각되기도 하고 요소 간의 관계가 독특하게 형성되기도 한다는 점을 생각하며 작품을 수용하게 한다.","6국05-04":"이 성취기준은 학습자가 작품에 대한 자신의 생각을 적극적으로 표현하고, 이를 타인과 나눔으로써 보다 주체적인 문학 수용 능력을 기르게 하기 위해 설정하였다. 이를 위해 인상적인 장면을 중심으로 작품에 대한 의견을 나누되, 인상적이라고 생각하는 이유나 근거를 작품과 연결 지어 설명하도록 한다. 또한 상대방의 수용 경험에도 귀를 기울여 작품에 대한 해석이 다양한 관점에서 이루어질 수 있음을 알고 문학 소통에 즐겁게 참여하도록 한다.","6국05-06":"이 성취기준은 작품을 읽고 성찰하는 과정을 통해 자신을 돌아보는 것은 물론 자신이 속한 공동체의 삶에 대해서도 생각하게 하기 위해 설정하였다. 학습자가 작품을 적극적으로 수용하여 작품에 담긴 가치를 내면화하는 가운데 자신의 삶의 모습을 되돌아보게 한다. 또한 공동체의 다양한 문제를 다룬 작품을 읽을 때에도 먼저 자신의 삶을 돌아보고, 함께 살아가는 삶을 위해 공동체 구성원으로서 가져야 할 바람직한 자세나 태도에 대하여 생각해 보도록 한다.","6국06-01":"이 성취기준은 정보 검색 도구의 특성을 이해하고 적절한 정보 검색 전략을 수립하여 자신의 목적에 맞는 매체 자료를 찾아 활용하는 능력을 향상하기 위해 설정하였다. 정보 유형별로 검색 결과를 제시하는 정보 검색 도구의 기능을 이해한다. 또한 핵심 단어 중심으로 검색이 되는 정보 검색 도구의 특징을 이해하여 자신의 목적에 적합한 검색어를 만들 수 있도록 한다. 인터넷의 특성을 고려하여 정보 검색 과정에서 지속적인 성찰과 점검을 통해 자신의 목적에 부합한 자료 검색 과정이 이루어질 수 있도록 한다.","6국06-02":"이 성취기준은 뉴스 및 각종 정보 매체의 매체 자료에 대해 신뢰성 측면을 중심으로 평가하는 능력을 기르기 위해 설정하였다. 뉴스 및 각종 정보 매체 자료는 개인과 공동체에 미치는 영향력이 크기 때문에 매체 자료를 수용할 때는 그것이 신뢰할 만한 것인지 평가하는 태도가 중요하다는 점을 이해하도록 한다. 매체 자료의 신뢰성은 제작자가 얼마나 해당 분야에 전문적이고 권위가 있는지, 실제 취재하거나 수집한 근거 자료를 기반으로 제작된 것인지, 근거 자료가 얼마나 정확하고 최신의 것이며 증빙 가능한 것인지 등의 측면에서 평가할 수 있다.","6국06-03":"이 성취기준은 매체 및 매체 자료의 양식과 수용자에게 끼칠 영향을 고려하여 복합양식 자료를 제작하는 능력을 기르기 위해 설정하였다. 의도나 주제를 드러내는 다양한 표현 양식을 이해하고 자신의 목적, 주제, 수용자 반응을 고려하여 이미지가 포함된 글, 카드 뉴스, 발표 자료, 동영상 등의 복합양식 매체 자료를 제작한 다음 이를 공유하여 그 효과성을 점검한다.","2수01-06":"덧셈은 두 자리 수의 범위에서 다루되, 합이 세 자리 수인 경우도 포함한다.","2수02-01":"물체, 무늬, 수 등의 배열을 관찰하여 일정하게 반복되거나 증가하는 규칙을 찾고 말, 수, 그림, 기호, 구체물, 행동 등의 다양한 방법으로 표현하게 한다. 그리고 물체, 무늬, 수의 배열에서 다음에 올 것이나 중간에 빠진 것을 추측하게 한다.","2수03-02":"쌓기나무로 만든 입체도형의 모양에 대해서 ‘∼의 앞’, ‘∼의 오른쪽’, ‘∼의 위’, ‘2층’ 등을 사용하여 말하게 한다.","2수03-04":"삼각형, 사각형, 원은 예인 것과 예가 아닌 것을 분류하는 활동을 통하여 직관적으로 이해하게 한다. 본뜨기, 도형판을 이용한 활동 등을 통해 삼각형, 사각형, 원의 모양을 그리게 할 수 있다.","2수03-10":"길이의 표준 단위를 도입하기 전에 구체물을 직접 비교해 보거나 여러 가지 임의 단위를 사용하여 구체물의 길이를 재어보는 활동을 통해 표준 단위의 필요성을 알게 한다.","2수03-12":"생활 주변의 여러 가지 물건들의 길이를 어림해 보고 자로 측정하여 확인하는 활동과 주어진 길이에 해당하는 선분을 그려 보는 활동을 통해 길이에 대한 양감을 기르게 한다.","2수04-02":"표를 이용하여 자료의 크기를 수로 정리하면, 자료의 크기를 나타내고 비교하는 데 편리하다는 점을 통해 수학의 유용성을 인식하게 한다.","2수04-03":"그래프를 이용하여 자료의 크기를 시각적으로 나타내면, 자료의 크기를 한눈에 비교하는 데 편리하다는 점을 통해 수학의 유용성을 인식하게 한다.","4수01-03":"덧셈은 세 자리 수의 범위에서 다루되, 합이 네 자리 수인 경우도 포함한다.","4수01-04":"곱셈은 ‘(두 자리 수)⟦times⟧(한 자리 수)’, ‘(세 자리 수)⟦times⟧(한 자리 수)’, ‘(두 자리 수)⟦times⟧(두 자리 수)’, ‘(세 자리 수)⟦times⟧(두 자리 수)’를 다룬다.","4수01-06":"나눗셈에서 ‘(두 자리 수)⟦div⟧(한 자리 수)’는 나누어떨어지는 경우와 나누어떨어지지 않는 경우를 포함하여 몫과 나머지를 이해하게 한다.","4수01-07":"나누는 수가 두 자리 수인 나눗셈에서는 ‘(두 자리 수)⟦div⟧(두 자리 수)’, ‘(세 자리 수)⟦div⟧(두 자리 수)’를 다룬다.","4수01-09":"1보다 작은 양을 나타내는 경우를 통하여 분수의 필요성이나 그 표현의 편리함을 인식하게 할 수 있다. 양의 등분할을 통하여 분수를 도입할 때 부분과 전체를 파악하게 하고, ‘분모’, ‘분자’를 사용한다.","4수02-02":"다양한 규칙을 찾을 수 있는 계산식의 배열, 수의 성질을 탐구할 수 있는 계산식의 배열을 다룬다.","4수02-03":"등호(⟦=⟧)의 의미를 토대로 구체물, 그림 등을 사용하여 주어진 식이 옳은지 판단하는 활동, 크기가 같은 두 양을 찾는 활동 등을 통해 동치 관계를 이해하게 한다.","4수03-04":"실생활에서 평면도형의 이동을 활용한 사례를 찾아서 이동에 따른 변화를 추론하고 위치나 방향이 어떻게 변화했는지 설명하게 한다.","4수03-05":"평면에서 점의 이동은 격자를 따라 위, 아래, 오른쪽, 왼쪽으로 ‘∼칸’, ‘∼cm’를 이동하는 수준에서 다룬다. 한 점의 이동에 대해 위치와 방향을 설명하는 데 초점을 두고, 꼭짓점의 이동을 이용하여 평면도형의 이동을 설명하는 활동은 다루지 않는다.","4수03-07":"컴퍼스를 사용하여 다양한 크기의 원을 그리는 방법을 원의 성질과 연결하여 이해하게 한다.","4수03-11":"도형판, 모양 조각 등의 교구를 이용한 구체적인 조작 활동을 통해 다각형과 정다각형을 이해하게 한다.","4수03-12":"다양한 교구와 공학 도구 등을 이용한 구체적인 활동을 통해 주어진 도형으로 여러 가지 모양을 다양하게 만들거나 채울 수 있다.","4수03-20":"초등학교에서는 무게와 질량의 개념을 엄밀하게 구분하지 않으며, 무게를 비교하고 측정하는 데에 g, kg의 단위를 사용하게 한다.","4수04-03":"여러 가지 문제를 해결하기 위해 자료를 수집, 정리하고 그래프로 나타내어 해석하는 일련의 과정을 직접 경험하게 한다. 자료의 크기를 비교할 때는 막대그래프로, 시간에 따른 변화의 경향을 알아볼 때는 꺾은선그래프로 나타내는 것이 편리함을 알고, 자료의 특성에 따라 목적에 맞는 적절한 그래프를 선택하게 한다.","6수01-11":"분수의 나눗셈은 ‘(분수)⟦div⟧(자연수)’, ‘(자연수)⟦div⟧(분수)’, ‘(분수)⟦div⟧(분수)’를 다룬다.","6수01-15":"소수의 나눗셈은 ‘(소수)⟦div⟧(자연수)’, ‘(자연수)⟦div⟧(소수)’, ‘(소수)⟦div⟧(소수)’를 다룬다.","6수02-02":"두 양을 비교할 때는 한 양을 기준으로 다른 양이 몇 배가 되는지를 나타낼 필요성을 인식하면서 비의 개념을 이해하게 한다.","6수03-01":"합동인 두 도형에서 대응점, 대응변, 대응각을 각각 찾게 하고 대응변의 길이와 대응각의 크기를 비교하는 활동을 통해 합동인 도형의 성질을 탐구하고 설명하게 한다.","6수03-10":"여러 가지 물체, 건축물, 예술품, 쌓기나무로 만든 입체도형 등의 위, 앞, 옆에서 본 모양을 이용해서 전체 모양을 추측하게 하고, 이에 대해 자신의 추론 과정을 설명하게 한다.","6수03-15":"여러 가지 원에서 (원주)⟦div⟧(지름)의 값을 구하여 모든 원에서 원주율이 일정함을 이해하게 하고, 원주율의 근삿값으로 3.14를 사용하게 한다.","6수03-16":"지름과 원주율을 이용하면 원주를 직접 측정하지 않고도 구할 수 있음을 알게 하고, 직사각형의 넓이를 구하는 방법을 이용하여 원의 넓이를 구하는 방법을 이해하게 한다.","6수04-01":"평균은 집단의 자료를 대표하는 값임을 이해하고, 여러 집단의 평균을 비교하는 활동을 통해 수학의 유용성을 인식하게 한다.","6수04-03":"해결하고자 하는 문제를 설정하고 그에 맞는 자료를 수집, 정리하여, 막대그래프, 꺾은선그래프, 띠그래프와 원그래프 중 적절한 그래프로 나타내고 해석하는 일련의 과정을 직접 경험하게 한다.","6수04-04":"‘확실하다’, ‘불가능하다’, ‘∼일 것 같다’, ‘∼아닐 것 같다’, ‘반반이다’ 등 일상에서 사건이 일어날 가능성을 나타내는 다양한 표현을 이해하고, 가능성의 크기를 비교하게 한다.","6수04-05":"가능성이 직관적으로 파악되는 생활 속의 간단한 사건에 대하여 그 가능성을 0, ⟦{1} over {2}⟧, 1 등과 같은 수로 표현하게 한다. 사건이 일어날 가능성과 일어나지 않을 가능성이 같은 경우에 사건이 일어날 가능성을 ⟦{1} over {2}⟧로 표현할 수 있음을 이해하게 한다.","6수04-06":"제비뽑기, 동전 던지기, 주사위 던지기, 회전판 돌리기 등과 같은 간단한 실험 결과를 나타낸 표나 그래프를 보고 사건이 일어날 가능성을 비교하고 대략적으로 예상하게 한다.","4사01-01":"은 학생들의 생활이 이루어지는 주변 여러 장소에서의 경험과 느낌을 글, 그림, 심상지도 등의 다양한 방식으로 표현하고, 이를 통해 사람마다 장소감의 차이가 나타날 수 있음을 이해하도록 설정한 것이다. 장소감이란 장소에 대한 인지, 감정, 태도, 행동을 포괄하는 것으로 개인이나 집단이 장소에 부여하는 의미나 관심을 뜻한다. 장소 경험을 공유하는 과정에서 장소감의 차이를 이해하고 서로 존중하며, 주변의 장소를 알아가면서 이에 대한 관심을 심화시키는 데 초점을 맞춘다.","4사01-02":"는 학생들이 생활하는 데 편익을 제공하는 주요 장소 및 시설이나 기관을 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 찾아보도록 설정한 것이다. 특히, 우리가 사는 곳의 놀이⋅여가, 안전, 교육⋅문화, 건강⋅의료 등과 관련 있는 장소를 조사하여 좋은 점, 불편한 점 등을 확인하고, 학생들의 관점에서 살기 좋은 곳의 조건을 생각하면서 우리가 사는 곳에 관심을 가지도록 하는 데 중점을 둔다.","4사02-01":"은 가정, 학교 등 학생 주변의 사례를 활용하여 역사의 시간 개념을 이해하도록 설정한 것이다. 역사에서 자주 사용하는 시간 표현 용어, 시간의 흐름 속에서 어떤 사건의 시간상 위치를 파악하는 등 역사의 시간 개념을 이해한다.","4사02-02":"는 주변의 오래된 물건이나 자료 등이 과거 모습을 알려주는 증거 역할을 한다는 것을 이해하도록 설정한 것이다. 학생의 애장품을 비롯해 생활 주변에서 볼 수 있는 오래된 물건이나 자료(신문 기사, 편지, 일기, 노래 가사, 사진 등), 주변 사람들의 증언 등을 활용한다.","4사02-03":"은 지역 사람들의 달라진 생활 모습을 탐구하며 역사의 변화와 지속을 이해하도록 설정한 것이다. 지역의 유래와 관련된 이야기, 지역의 변화를 알려주는 사진이나 영상 등 역사 자료를 활용하여 (변형되어, 혹은 그대로) 이어져 내려온 것, 사라진 것을 찾아 지역 사람들의 생활이 어떻게 달라졌는지 살펴본다.","4사03-01":"은 사례를 통해 저출산, 고령화, 지능정보화 등 최근 사회 변화가 가져온 현상과 특징을 파악하고, 그로 인해 우리의 생활 모습이 어떻게 변화되는지 분석하도록 설정한 것이다. 이를 통하여 사회 변화에 대응할 수 있는 역량을 기르는 데 초점을 맞추도록 한다.","4사03-02":"는 외국인 이주민의 증가, 1인 가구와 비혼, 반려동물 양육 등 다양한 문화가 확산⋅공유되면서 나타나는 긍정적 효과와 사회문제를 사례 또는 통계 자료를 통해 파악하도록 설정한 것이다. 이를 바탕으로 나와 다른 사람들의 삶의 방식이나 문화를 존중하는 태도를 함양하는 데 초점을 맞춘다.","4사04-01":"은 옛날의 다양한 풍습을 살펴보며 당시 사람들의 생활을 이해하고, 오늘날과 비교하여 변화상을 파악하도록 설정한 것이다. 놀이, 세시 풍속 등 여러 풍습을 통해 변화상을 알아보고 풍습 속에 담긴 옛날 사람들의 생활과 생각을 이해한다.","4사04-02":"는 교통로 및 교통수단의 변화와 달라진 사람들의 생활 모습과의 관계를 이해하도록 설정한 것이다. 시대에 따른 교통의 변화가 사람과 물자의 이동 및 생활 전반에 어떤 변화를 일으켰는지 살펴본다. 그리고 교통 발달에 따른 생활공간의 확대를 고려하여 변화를 설명한다.","4사04-03":"은 시대에 따른 통신수단의 변화 과정을 파악하고 이를 통해 달라진 사람들의 생활 모습을 파악하도록 설정한 것이다. 정보 교류와 의사소통 방식의 변화를 파악하여 통신 발달에 따른 공간적 변화를 탐색한다.","4사05-01":"은 우리 지역을 표현한 다양한 종류의 지도를 탐색하고, 우리 지역의 지도를 활용하여 방위, 기호와 범례, 축척, 높낮이 표현 방식 등 지도 제작에 필요한 요소를 파악하도록 설정한 것이다. 여기서는 지도의 요소를 이해하여 일상생활에서 지도를 활용하는 데 초점을 맞춘다.","4사05-02":"는 행정구역을 나타낸 지도에서 지역의 위치를 파악하고, 지역의 지리 정보를 바탕으로 지역의 특징을 탐구하도록 설정한 것이다. 우리나라 지도에서 시⋅도 단위의 행정구역을 파악하면서 우리 지역(시⋅군⋅구)의 위치를 확인하고, 지역의 지리 정보(위치, 면적, 인구, 지형, 기온, 강수량 등)를 다른 지역과 비교하여 지역이 지닌 특징을 이해하는 데 초점을 맞춘다.","4사06-01":"은 문화유산에 관한 기본 지식 및 가치를 지역의 문화유산을 통해 이해하도록 설정한 것이다. 지역 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 이를 토대로 옛날 사람들의 생활 모습을 추론하며 과거와 현재를 이어주는 귀중한 자료로서 문화유산의 가치를 파악한다.","4사06-02":"는 지역에 있는 박물관, 기념관, 유적지 등을 방문하여 지역의 역사를 이해하기 위해 설정한 것이다. 박물관, 기념관, 유적지 등을 온오프라인으로 방문하여 학생이 주도적으로 지역의 역사에 관한 지식을 습득하고 해석하며 표현한다. 그리고 지역의 역사를 보존하고 실천하는 태도를 기른다.","4사07-01":"은 자원의 희소성 개념을 이해하고, 이를 바탕으로 경제활동에서 합리적 선택의 방법을 파악하도록 설정한 것이다. 여기서는 경제활동에서 선택의 문제가 발생하는 이유와 합리적 선택의 중요성을 이해하는 데 초점을 맞춘다.","4사07-02":"는 생산과 소비의 개념을 이해하고, 한 지역의 생산과 소비 활동이 다른 지역과 상호의존 관계에 있음을 이해하도록 설정한 것이다. 여기서는 지역에서 이루어지는 생산과 소비 활동의 사례를 통하여 한 지역의 경제활동이 다른 지역과 상호 의존 관계에 있다는 사실을 파악하는 데 초점을 맞춘다.","4사08-01":"은 학교 자치 사례를 통해 민주주의의 의미를 이해하고, 이를 바탕으로 학교생활에서 학교 자치를 실천할 수 있도록 설정한 것이다. 여기서는 학생이 학교 자치를 통해 민주주의를 실천하고 참여할 수 있는 능력을 기르는 데 초점을 맞춘다.","4사08-02":"는 민주주의의 의미에 기초하여 마을이나 지역에서 이루어지는 주민 자치와 참여의 중요성을 파악하도록 설정한 것이다. 여기서는 마을이나 지역사회에서 이루어지는 민주주의의 사례를 통해 주민 자치와 주민 참여의 중요성을 이해하고 지역사회의 문제 해결에 관심을 갖고 참여하는 태도를 기르는 것에 초점을 맞춘다.","4사09-01":"은 각 지역에서 발생하는 문제를 민주적 방식으로 해결하는 과정과 방법을 습득하도록 설정한 것이다. 지리적 문제, 환경 문제, 사회적 문제, 역사적 문제 등 다양한 문제를 찾아서 토론을 통해 합리적으로 해결하는 방법과 능력을 배우는 데 초점을 맞춘다.","4사09-02":"는 지역의 자연환경, 역사, 문화, 생산물 등을 알리기 위한 여러 활동을 조사하면서 지역을 이해하도록 설정한 것이다. 여기서는 지역의 자연환경, 역사, 문화, 생산물 등을 살펴보고, 지역에 관심을 가지며, 지역사회에 참여하는 태도를 기르는 데 주안점을 둔다.","4사10-01":"은 우리 지역과 다른 자연환경 및 인문환경이 나타나는 곳을 살펴보고, 환경의 이용과 개발로 변화한 모습을 탐구하도록 설정한 것이다. 여기서는 다양한 환경 특성을 파악하고, 개발로 인해 나타난 긍정적, 부정적 변화 모습을 균형 잡힌 관점으로 파악하는 데 중점을 둔다.","4사10-02":"는 우리나라 여러 도시의 특징을 탐구하면서 도시에서 나타나는 삶의 모습을 종합적으로 이해하도록 설정한 것이다. 사례에서 도시의 경관, 인구, 교통, 산업, 생활방식의 특징을 이해하고 도시 생활의 좋은 점과 문제들을 파악하는 데 중점을 둔다.","6사01-01":"은 우리나라 주요 산지, 하천, 해안 지형의 위치를 지도에서 확인하고 그 분포 특징을 파악하도록 설정한 것이다. 이를 바탕으로 국토 환경에 대한 기초적인 지식을 기르는 데 중점을 둔다.","6사01-02":"는 독도의 위치, 지형, 기후, 동식물 등의 지리적 특성을 파악하고 독도에 대한 역사 기록을 탐구하여 영토 주권 의식을 기르도록 설정한 것이다. 이를 바탕으로 영토로서 독도의 가치를 인식하고 위상을 확인하는 데 주안점을 둔다.","6사02-01":"은 기후 그래프를 비롯해 디지털 영상 자료와 지도, 통계 자료, 사진 등 다양한 시각 자료를 활용하여 우리나라의 계절별 기후 특징을 기온, 강수, 바람의 측면에서 탐구하도록 설정한 것이다. 또한 기후변화로 자연재해가 심화하고 있음을 파악하고 기후 행동 등에 참여하는 태도를 갖는 데 주안점을 둔다.","6사02-02":"는 우리나라의 인구 분포 특징을 수도권 인구 집중과 관련한 자료를 중심으로 탐구하면서 인구 집중의 원인, 문제, 그리고 이를 해결하려는 노력을 알아보도록 설정한 것이다. 이를 통해 인구 분포의 불균형과 인구 문제의 심각성을 이해하여 국토 균형 발전의 중요성을 인식하고 해결 방안을 탐색하는 데 주안점을 둔다.","6사03-01":"은 우리 생활에 영향을 미치는 법의 의미와 역할을 일상 사례를 통해 이해하고, 헌법에 규정된 인권을 보장하는 다양한 사례를 조사하도록 설정한 것이다. 이를 통해 준법 태도와 인권 의식을 기르는 데 초점을 맞춘다.","6사03-02":"는 일상생활에서 발생하는 인권 침해 문제의 해결 방안을 제시할 수 있는 능력을 기르도록 설정한 것이다. 인권 문제 해결과 관련된 토론 및 문제 해결의 과정을 통해 인권 보호 활동에 참여하는 능력과 태도를 함양하는 데 중점을 둔다.","6사04-01":"은 선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활 모습을 추론하도록 설정한 것이다. 당시 사람들의 생활을 추론하는 데 적절한 유적과 유물 등을 선정하여 탐구 과정을 경험하도록 한다.","6사04-02":"는 고대의 역사 기록이나 유적과 유물을 활용하여 당시 사람들의 생각이나 생활 모습을 추론하기 위해 설정한 것이다. 󰡔삼국사기󰡕, 󰡔삼국유사󰡕 등 역사 기록이나 삼국⋅가야⋅통일신라⋅발해 사람들의 생각과 생활 모습이 드러난 유적과 유물을 탐구하여 고대 사회의 여러 면모를 알아본다.","6사04-03":"은 유적과 유물, 역사 기록 등 여러 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 탐구하도록 설정한 것이다. 종교, 성별, 신분, 교류 등과 관련된 내용 중에서 고려 시대 사회 모습과 사람들의 생활을 보여주는 주제를 선택하여 살펴본다.","6사05-01":"은 유교 문화가 정착되는 과정에서 조선 시대 사람들의 생각과 생활이 어떻게 달라졌는지를 여러 분야에서 파악하도록 설정한 것이다. 유교 문화가 조선 사회에 미친 영향을 다양한 사례를 중심으로 탐구하는 데 초점을 둔다.","6사05-02":"는 조선 후기 사회⋅문화적 변화 양상과 개항 이후 근대 문물 수용으로 달라진 생활 모습을 이해하도록 설정한 것이다. 조선 후기 새로운 문화 주체로 등장한 사람들의 활동을 살펴보고 개항 이후 근대 문물의 수용, 변형 등을 파악한다.","6사06-01":"은 일제 식민 통치와 국권 회복을 위한 저항으로 달라진 사회와 식민 통치하에 사람들의 생활 모습을 알아보도록 설정한 것이다. 3⋅1 운동 등 일제에 대한 저항을 알아보고, 이로 인해 달라진 사회 변화와 사람들의 생활을 사례를 중심으로 살펴본다.","6사06-02":"는 8⋅15 광복과 6⋅25 전쟁이 사회와 사람들의 생활에 가져온 변화를 살펴보도록 설정한 것이다. 8⋅15 광복과 6⋅25 전쟁을 알아보고, 성별, 연령, 계층 등 사람들의 생활과 사회 전반에 미친 영향을 구체적 사례로 파악한 후 오늘날까지 영향을 미치고 있음을 이해한다.","6사07-01":"은 분단으로 나타난 문제점과 평화 통일을 위한 과제를 탐색하도록 설정한 것이다. 분단이 사회와 사람들의 생활에 미친 영향을 알아보고, 분단과 관련된 장소를 평화의 장소로 만들려는 사람들의 노력을 살펴본다. 그리고 평화 통일의 필요성을 인식하고 이를 위해 우리가 할 수 있는 일을 탐색한다.","6사07-02":"는 민주화, 산업화가 사람들의 생활과 어떤 관계가 있는지 알아보도록 설정한 것이다. 사회적인 강압이나 통제에서 벗어나기 위해 노력한 다양한 분야 사람들의 모습과 산업화로 달라진 사람들의 생활을 여러 사례를 중심으로 이해한다.","6사08-01":"은 민주주의에서 시민의 주권 행사의 한 방법으로써 선거의 역할과 중요성을 파악하도록 설정한 것이다. 이를 바탕으로 선거에 주체적으로 참여하는 태도를 형성하는 데 중점을 둔다.","6사08-02":"는 우리나라 민주주의에서 국회, 행정부, 법원이 하는 일을 이해하도록 설정한 것이다. 이를 바탕으로 시민의 자유와 권리 보장 측면에서 권력 분립의 이유를 파악하는 데 중점을 둔다.","6사08-03":"은 민주주의에서 신문, 방송, 사회 관계망 서비스(SNS) 같은 미디어가 하는 역할을 파악하고, 미디어가 제공한 거짓 또는 왜곡된 정보와 내용 등을 찾아 비판적으로 분석하고 평가하도록 설정한 것이다. 이런 비판적 분석을 통해 미디어를 올바르게 이용하는 능력을 함양하는 데 초점을 맞춘다.","6사09-01":"은 지구본, 세계지도뿐만 아니라 디지털 공간 영상 정보 등 다양한 공간 자료의 특성을 이해하고 이를 활용하여 세계에 대한 기초적인 지리 정보를 획득하려고 설정한 것이다. 여기서는 경⋅위도의 의미를 이해하고, 이를 활용하여 위치를 표현하는 방법을 익히도록 한다.","6사09-02":"는 위치가 갖는 중요성을 인식하여 지구본과 세계지도에서 세계의 대륙 및 대양의 위치를 파악하도록 설정한 것이다. 세계 여러 국가의 위치와 영토의 형상 등 기초적인 지리 정보를 획득하는 데 주안점을 둔다.","6사10-01":"은 세계적으로 유명한 산지, 하천, 해안 지역 등의 경관 특징과 그곳에서 살아가는 사람들의 생활 모습에서 세계 여러 지역의 다양성을 이해하도록 설정한 것이다. 여기서는 우리와 다른 지역의 생활 모습에 관심을 갖는 데 주안점을 둔다.","6사10-02":"는 기온 및 강수량을 나타낸 기후 그래프, 지도, 사진 자료 등을 활용하여 세계 주요 기후의 분포를 파악하도록 설정한 것이다. 여기서는 기후와 인간 생활을 관련지어 이해하는 데 중점을 둔다.","6사11-01":"은 시장경제의 특징에 대한 이해를 바탕으로 가계와 기업의 역할 및 상호 의존 관계를 파악하고, 근로자의 권리와 기업의 자유로운 경제활동 및 사회적 책임을 탐색하도록 설정한 것이다. 이를 바탕으로 근로자의 권리를 보호하고 기업이 자유로운 경제활동과 이윤을 추구하면서 사회적 책임을 이행하는 것의 중요성을 인식하는 데 초점을 맞춘다.","6사11-02":"는 우리나라의 경제성장이 우리 생활에 미친 긍정적⋅부정적 영향을 통계 자료를 통해 파악하고 빠른 경제성장으로 발생한 문제의 해결 방안을 찾도록 설정한 것이다. 또한, 토론을 통해 빠른 경제성장으로 발생하는 문제를 합리적으로 해결하는 방안을 찾는 데 중점을 둔다.","6사11-03":"은 학생이 접할 수 있는 수입⋅수출 상품의 사례에서 무역의 의미와 중요성을 파악하고 세계 여러 나라 간 무역이 발생하는 이유를 탐구하도록 설정한 것이다. 이를 바탕으로 오늘날 여러 나라가 무역을 통해 경쟁 및 상호 의존 관계에 있음을 파악하는 데 중점을 둔다.","6사12-01":"은 세계의 인구 분포를 파악하고, 인구수 및 인구 밀도의 특징이 두드러진 국가를 탐구하도록 설정한 것이다. 여기서는 지구촌 시대의 세계 여러 지역에 대한 기본적인 지리 정보를 습득하는 데 초점을 맞춘다.","6사12-02":"는 지구촌의 평화와 발전을 위협하는 문제를 파악하고 이를 해결하려는 방안을 탐색하며, 지속가능한 지구촌을 건설하는 데 관심을 가지도록 설정한 것이다. 세계에 대한 올바른 이해를 바탕으로 세계시민으로서 지녀야 할 관점과 태도를 함양하는 데 주안점을 둔다.","4과01-01":"무거운 물체를 밀고 당길 때와 가벼운 물체를 밀고 당길 때 드는 힘의 크기를 느끼는 데 중점을 둔다.","4과01-03":"무게와 질량을 구분하지 않으며 무게를 비교하는 단위로 g, ㎏을 사용한다.","4과01-04":"지레, 빗면과 같은 간단한 도구를 이용할 때 힘의 크기가 달라진다는 점을 관찰하는 데 중점을 두며, 도구의 원리나 구조적 특성을 다루지 않는다.","4과02-01":"동물의 형태적 특징을 찾고 그 특징에 따라 분류 기준을 정하여 분류하는 활동을 하도록 하며 생물학적 분류 체계는 다루지 않는다.","4과02-02":"서식지에 따른 동물의 생김새와 생활 방식의 다양성을 다루고, 적응 개념은 다루지 않는다.","4과03-01":"여러 가지 식물의 잎을 채집해 생김새 등과 같은 외형적 특징에 따라 기준을 세워 분류하는 활동을 하며 생물학적 분류 체계는 다루지 않는다.","4과03-02":"서식지에 따른 식물의 생김새와 생활 방식의 다양성을 다루고, 적응 개념은 다루지 않는다.","4과04-02":"씨가 싹트는데 필요한 조건은 물과 온도로 한정하고, 식물이 자라는데 필요한 조건은 물과 햇빛으로 제한한다.","4과04-03":"한살이의 유형을 이해하는 생물의 범위는 동물과 식물에 한정하여 다루고, 식물의 한살이 유형은 한해살이와 여러해살이로 구분하여 이해하도록 한다.","4과05-01":"나무, 철, 유리, 플라스틱 등 학생들이 일상생활에서 쉽게 접할 수 있는 물질의 다양한 성질을 관찰하고 비교하는 활동에 중점을 두고, 이를 바탕으로 여러 가지 물체를 물질의 종류에 따라 분류하도록 한다.","4과05-02":"물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하고 비교하는 활동에 중점을 두고, 한 가지 물질이 여러 가지 상태로 존재한다는 것은 다루지 않는다.","4과06-02":"바닷물의 침식, 운반, 퇴적 작용에 대해서는 다루지 않는다.","4과06-03":"밀물과 썰물은 바닷물의 높이 변화를 다루는 수준이며, 조석 용어와 원인에 대해서는 다루지 않는다.","4과07-03":"소리가 여러 가지 물질을 통해 전달되는 현상을 관찰하는 데 중점을 두며, 소리 전달의 과학적 원리는 다루지 않도록 한다.","4과08-01":"질병은 예방접종이나 범유행 상황 등 학생이 경험하거나 인지할 수 있는 생활 속 질병을 다룬다.","4과08-02":"감염 과정은 생활 습관과 관련지을 수 있는 접촉 감염, 비말 감염, 공기 감염, 수인 감염, 타액 감염 등의 사례로 한정하여 다루며, 감염병의 특성과 면역 반응을 구체적으로 다루지 않는다.","4과10-01":"물의 상태 변화는 관찰 가능한 현상 수준에서만 다루고, 물의 상태가 변하는 까닭은 다루지 않는다.","4과10-02":"물이 얼 때와 얼음이 녹을 때의 부피 변화는 물기둥의 높이 변화로 관찰하도록 한다. 물의 증발과 끓음을 비교할 때는 물이 수증기로 상태가 변하는 현상이라는 공통점에 중점을 둔다.","4과11-01":"강 주변 지형은 흐르는 물에 의한 침식, 운반, 퇴적 작용을 중심으로 다룬다.","4과11-02":"화산 활동과 화산 분출물을 중심으로 학습한다.","4과11-03":"화성암은 현무암과 화강암만 다룬다.","4과11-04":"화산 활동의 피해와 이로운 점을 함께 다루며, 지진 발생 원인은 다루지 않는다.","4과12-03":"우리 생활에 생명과학이 이용되는 사례는 균류, 원생생물, 세균을 중심으로 학생들이 생활 속에서 경험하고 인지할 수 있는 수준으로 다룬다.","4과13-01":"달의 위상변화 원인을 다루지 않고, 달의 모양이 주기적으로 바뀌는 현상을 관찰하여 확인하는 데 초점을 둔다.","4과13-02":"태양계를 구성하는 행성들의 표면적인 특징 위주로 조사하고, 태양과 행성의 실제 크기나 태양에서 행성까지의 실제 거리, 행성의 질량, 자전 속도, 대기 성분 등과 같은 구체적인 물리량은 다루지 않는다.","4과13-03":"별의 정의는 행성과 비교하여 스스로 빛을 내는 천체라는 수준에서만 다룬다. 별자리는 학생들이 쉽게 관찰할 수 있는 북극성 주변의 별자리를 다루며, 계절별 별자리와 관련짓지 않는다.","4과14-01":"숲, 바다, 강 등 다양한 생태계를 다루고, 각 생태계에서 생물 요소와 비생물 요소를 분류할 수 있게 한다.","4과14-02":"생태계에서 다양한 먹이 관계를 알아보고 먹이 관계가 복잡할수록 생물이 생존하는 데 유리함을 이해하게 한다.","4과14-03":"대기오염, 수질오염, 토양오염 등의 환경오염에 관한 사례를 중심으로 다루고, 생태계 보전을 위해 우리가 해야 할 일을 조사하여 실천함으로써 생태계 보전에 대한 의식을 가지게 한다.","4과15-01":"부피가 같은 용기에 공기를 1기압으로 담은 상태와 이 상태에서 공기를 넣거나 뺀 상태의 무게를 비교하는 실험을 바탕으로 기체가 무게가 있음을 설명한다.","4과15-02":"온도를 높일 때와 낮출 때 공기의 부피 변화, 압력을 높일 때와 낮출 때 공기의 부피 변화를 관찰하도록 한다. 온도나 압력에 따라 기체의 부피가 어떻게 변하는지를 정성적으로 이해하도록 하고, 입자 모형으로 기체의 부피가 변하는 까닭은 설명하지 않는다.","4과16-01":"기후변화의 과학적 원인은 다루지 않으며 기온, 강수량 등 기후요소가 평년값에 비해 현저히 높거나 낮은 사례(가뭄, 폭설, 폭염, 한파, 홍수 등)를 탐구하도록 한다.","4과16-02":"인간의 삶에 부정적인 영향을 미치는 기후변화 현상의 사례를 모형이나 실험 활동을 통해 알아보고, 이에 기반하여 기후변화로 인한 인간의 피해를 예측하고 설명할 수 있도록 한다.","6과01-01":"지층의 두께나 색 등을 다루고, 지층이 휘어지거나 끊어진 모습을 소개하되 생성 원리는 다루지 않는다.","6과01-02":"퇴적암은 이암, 사암, 역암만 다룬다.","6과01-03":"화석 표본은 동물과 식물의 특징이 분명하게 드러나는 것을 사용한다.","6과02-02":"빛이 직진, 반사, 굴절하는 성질은 햇빛이나 레이저 광선의 진행으로 나타나는 현상을 관찰하여 알 수 있도록 하되, 반사와 굴절의 법칙은 다루지 않는다. 또, 볼록렌즈와 물체 사이의 거리, 볼록렌즈와 눈 사이의 거리에 따른 물체의 모습 차이는 다루지 않는다.","6과03-01":"용질, 용매, 용액, 용해의 개념을 다루되, 입자 모형으로 용해 현상을 설명하거나 용해 현상이 일어나는 과학적 이유나 원리를 설명하지 않는다. 용해 전과 후의 무게를 비교하여 용해 과정에서 물질이 사라지지 않음을 이해하도록 한다.","6과03-02":"진하기가 다른 두 용액에서 같은 물체의 뜨는 정도가 다름을 이용하여 용액의 상대적인 진하기를 비교하도록 한다.","6과04-01":"중학교와 고등학교 과정에서는 뼈와 근육에 대해서 학습하지 않으므로, 뼈와 근육의 구조와 기능을 기초적으로 이해하는 데 중점을 둔다.","6과04-02":"우리 몸의 각 기관은 종류, 위치, 생김새, 기능을 중심으로 탐구한다.","6과04-03":"질병은 소화, 순환, 호흡, 배설 기관과 관련된 것으로 조사하고 건강을 유지하기 위한 생활 방식은 각 질병의 예방법을 중심으로 다룬다.","6과05-01":"혼합물의 의미를 학습한 뒤 혼합물의 분리 실험을 진행하도록 한다. 혼합물은 두 가지 이상의 물질이 성질이 변하지 않고 섞여 있는 상태라는 수준에서 다룬다. 골고루 섞이지 않는 액체 혼합물 분리에서 액체가 골고루 섞이지 않는 까닭은 다루지 않는다.","6과06-01":"기상 요소는 기온, 바람, 습도, 구름의 양, 강수량을 중심으로 다루고, 기상 자료에서 규칙성을 파악하도록 한다.","6과06-02":"구름에서 비와 눈이 내리는 과정을 다루지 않고 현상을 중심으로 다루며, 단열 팽창과 관련된 구름의 생성 과정은 다루지 않는다.","6과06-03":"고기압과 저기압의 날씨와 고기압에서 저기압으로 부는 바람의 방향을 이해하는 수준에서 현상 중심으로 다룬다.","6과07-02":"온도가 다른 두 물체를 접촉하는 탐구에서는 두 물체의 온도 변화를 측정하는 데 중점을 두고, 물체의 온도가 변하는 원인이 온도가 높은 물체에서 온도가 낮은 물체로 열이 이동하기 때문이라는 사실을 추리하도록 한다. 단, 열평형이라는 용어는 사용하지 않는다.","6과07-03":"전도, 대류, 복사는 고체, 액체, 기체에서의 열의 이동과, 빛에 의한 열 이동 현상을 관찰하는 데 중점을 두고 다룬다.","6과08-02":"재생에너지는 태양 에너지, 풍력, 수력, 해양 에너지, 지열 에너지, 바이오 에너지 등을 의미한다.","6과08-03":"효율적인 자원의 이용 방법에서 물 자원과 산림 자원, 광물 자원을 종합적으로 다루며, 학생들이 배운 내용을 바탕으로 생활 속에서 자원의 소중함을 느끼고, 효율적인 이용 방법을 공유하고 실천할 수 있도록 한다.","6과09-01":"리트머스 시험지, 페놀프탈레인 용액, 붉은 양배추 용액 등과 같은 지시약의 색깔 변화를 이용하여 여러 가지 용액을 산성 용액과 염기성 용액으로 분류하도록 한다.","6과09-02":"산성 용액은 탄산 칼슘과 반응하고 염기성 용액은 단백질과 반응하는 성질을 중심으로 다룬다. 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화에서 지시약이 들어 있는 용액의 색깔이 변하는 현상을 관찰하는 수준에서만 다루고 중성, pH, 중화 개념은 다루지 않는다.","6과10-01":"시간에 따라 위치가 변하는 다양한 운동을 다루면서 처음 위치와 나중 위치를 간단한 좌표 평면 위에 표현하되 두 위치 사이의 거리는 구하지 않는다.","6과10-02":"물체의 속력을 구할 때 물체가 한 길을 따라 한 방향으로 운동하는 경우만 다루며, 속력의 단위 변환에 중점을 두지 않는다.","6과11-01":"세포 관찰은 식물 세포로 하고, 세포의 구조는 핵, 세포막, 세포벽을 용어 수준에서 다룬다.","6과11-02":"식물의 기관에서 물과 양분의 이동을 탐구하면서 식물의 기관이 서로 연결되어 있음을 다룬다.","6과11-03":"학생들이 관심 있는 식물의 구조와 기능을 관찰하거나 조사하고 이를 설명하는 자료를 만들어 발표하고 공유하게 한다.","6과12-01":"남쪽 하늘을 바라보는 관측자 관점에서 태양과 별의 위치가 달라지는 현상을 중심으로 다룬다.","6과12-02":"지구의 자전에서는 지구가 자전축이 기울어진 채 하루에 한 바퀴 도는 것을 중심으로 다룬다.","6과12-03":"별자리 명칭보다는 계절에 따라 보이는 별자리와 별자리의 위치가 달라지는 까닭을 이해하는 데 초점을 둔다.","6과13-03":"지구 자전축이 기울어진 채 공전하기 때문에 계절에 따라 태양의 남중 고도가 달라져 지표가 받는 태양 에너지의 차이로 계절의 변화가 생김을 이해하게 한다.","6과14-01":"서로 다른 물질을 섞었을 때 물질의 성질이 달라지는 변화를 활용한 재미있고 간단한 실험을 실시한다. 물질을 섞은 후 물질의 성질이 달라지는 까닭은 다루지 않으며, 물리 변화나 화학 변화 용어를 도입하지 않는다.","6과14-02":"양초, 알코올, 나무 등과 같은 물질의 연소를 중심으로 다룬다.","6과14-03":"물이나 이산화 탄소와 같은 연소 생성물은 염화 코발트 종이나 석회수 등을 이용한 실험으로 확인하고, 그을음은 연소 생성물로 다루지 않는다.","6과14-04":"생태계의 피해 사례는 연소 생성물 중 이산화 탄소로 인한 피해 사례를 중심으로 조사한다.","6과15-02":"전구의 직렬연결과 병렬연결은 다루지 않고, 전지의 연결은 직렬연결만 다룬다.","6과15-03":"전자석은 전지를 이용하여 제작하고, 전지의 수에 따라 전자석의 세기가 달라지는 현상, 전지의 연결 방향에 따라 전자석의 극이 달라지는 현상을 관찰하여 영구 자석과의 차이를 비교하도록 하되, 전류에 의한 자기장 개념은 도입하지 않는다.","6과16-01":"단순한 상상이 아니라 현재의 다양한 정보를 기반으로 미래 사회의 문제를 예상해보도록 한다.","6과16-02":"과학자와 관련된 직업을 다루는 것이 아니라 학생이 희망하는 다양한 직업을 기준으로 하여 해당 직업과 관련된 과학적 요소를 찾도록 한다.","4영01-04":"이 성취기준은 단어, 어구, 문장을 개별 소리와 철자 관계에 주목하며 소리 내어 읽음으로써 독자적인 문자 해독의 기초를 형성하는 데 초점이 있다. 초기 학습 단계에서는 소리와 철자 관계가 규칙적이면서 친숙한 단어를 읽고, 나아가 두음이나 각운이 같은 단어를 포함한 어구나 문장, 의미를 알고 있는 어구나 문장을 반복하여 읽으며 소리와 철자 관계를 이해하는 것을 의미한다.","4영01-06":"이 성취기준은 말이나 대화를 듣고 명시적이고 구체적으로 언급된 정보를 파악하는 사실적 이해의 수준을 말하며, 담화의 상황과 내용을 이해하는 데 가장 핵심이 되는 한두 가지의 정보를 파악하는 것을 의미한다.","4영01-07":"이 성취기준은 영어 듣기와 읽기 전략에 관한 것으로 실물, 그림, 동작 등의 시각 정보를 활용하여 담화의 상황이나 내용, 문장의 의미를 파악하는 것을 의미한다.","4영01-09":"이 성취기준은 시, 노래, 이야기 등 문학이나 예술적 감성을 불러일으키는 듣기 자료를 통해 기쁨, 슬픔 등의 감정을 느끼고 공감하는 것을 의미한다.","4영02-03":"이 성취기준은 단어를 쓰는 단계에서 학습자가 기계적으로 철자를 외워서 쓰는 것이 아니라 단어의 개별 소리에 대응하는 철자를 생각해 보며 쓰도록 하는 것을 의미한다.","4영02-05":"이 성취기준은 간단한 인사말과 함께 자신과 가족, 친구 등의 이름이나 외모, 주변의 물건이나 동물 등의 특징을 쉬운 언어 형식의 한두 문장으로 말하거나 제시된 문장을 그대로 보고 쓰는 것을 의미한다.","4영02-09":"이 성취기준은 의사소통 과정에서 사진, 그림, 디지털 매체 등을 활용하여 다양한 방식으로 의미를 전달하거나 교환하는 것을 말한다. 이는 표정, 몸짓, 동작 등의 비언어적 수단을 수반하여 말하는 것과 함께 그림 글자나 단어 쓰기, 고안 철자(invented spelling) 쓰기, 철자 점검하며 다시 쓰기 등의 전략을 적절하게 사용하는 것을 의미한다.","4영02-10":"이 성취기준은 말하기⋅쓰기 활동 및 과업을 수행하는 과정에서 학습자가 흥미와 자신감을 가지고 능동적으로 참여하도록 다양한 학습 경험을 제공하는 데 초점이 있으며, 대화 상대자의 영어 사용 수준이나 문화적 차이를 고려하여 상대방을 배려하고 차례를 지키며 대화에 참여하도록 하는 것을 의미한다.","6영01-06":"이 성취기준은 말이나 대화, 글의 흐름을 파악하는 데 초점을 둔 것으로, 주요한 일이나 사건의 전후 관계 및 시간적 순서를 파악하는 것을 의미한다. 그림이나 만화 등을 이용하여 사건이 일어난 순서에 따라 연결하거나 배열하기, 일이 일어난 순서대로 번호 쓰기 등의 활동을 하는 수준을 말한다.","6영01-07":"이 성취기준은 듣기나 읽기 전⋅중⋅후 과정에서 다양한 단서를 활용하여 담화나 글의 내용을 예측하기, 특정 정보를 찾아 듣거나 읽기, 내용 확인을 위해 다시 듣거나 읽기 등의 전략을 활용하는 것을 의미한다.","6영01-08":"이 성취기준은 일상생활 주제에 관해 다양한 매체로 표현된 학습 자료를 듣거나 읽으면서 영어에 대한 흥미와 자신감을 높이고, 학습자 스스로 자신의 수준에 맞는 다양한 영어 자료를 자기주도적으로 찾아 즐기는 것을 의미한다.","6영01-10":"이 성취기준은 공동체 구성원으로서의 가치⋅태도와 관련된 것으로, 일상생활 주제나 문화에 관한 담화나 글을 듣거나 읽으면서 다른 사람의 생각과 의견을 존중하고 이해하는 태도를 갖는 것을 의미한다. 이는 우리나라와 다른 문화권의 다양한 의사소통 방식과 생활 양식을 수용하는 것을 포함한다.","6영02-05":"이 성취기준은 주변의 장소를 찾아가는 방법이나 위치, 일상생활에서 이루어지는 활동을 위한 일련의 행동 순서나 방법에 대하여 두세 문장으로 말하거나 쓰는 것을 의미한다. 이때 문장과 문장을 이어 주는 말(and, but 등)이나 순서를 나타내는 말(first, second 등)을 적절하게 활용할 수 있다.","6영02-08":"이 성취기준은 초대, 감사, 축하 등을 목적으로 하는 카드나 이메일, 경험을 담은 일기나 기행문 등 일상생활에서 빈번하게 일어나는 쓰기의 상황과 목적을 고려하여 글을 쓰는 것으로서, 예시문을 참고하여 글의 형식에 맞게 적절한 내용으로 변형하거나 응용하여 쓰는 수준을 말한다.","6영02-09":"이 성취기준은 구어나 문어로 의사소통하는 과정에서 학습자의 수준과 특성에 알맞은 매체와 전략을 사용하여 창의적으로 의미를 생성하고 표현하는 것을 말한다. 이는 브레인스토밍이나 생각 그물 등을 활용하여 아이디어를 생성하고, 이를 동작이나 그림과 같은 전통적인 매체뿐만 아니라 다양한 앱이나 디지털 매체 등을 활용하여 새로운 방법으로 말하거나 쓰는 것을 의미한다. 또한 의사소통 과정에서 발생하는 어려움을 극복하기 위해 반복하기, 반복 및 확인 요청하기 등의 말하기 전략과 고쳐 쓰거나 다시 쓰기 등의 쓰기 전략을 활용하는 것을 의미한다.","6영02-10":"이 성취기준은 온오프라인 공간에서 제공된 다양한 형태의 말하기⋅쓰기 과업이나 활동에 흥미와 자신감을 가지고 능동적으로 참여하는 것을 의미한다. 지속적으로 이루어지는 짝이나 모둠별 말하기⋅쓰기 활동을 통해 학습자들이 서로 가르쳐 주거나 배우는 과정에서 긍정적인 피드백을 주고받으며 말하거나 쓰고 싶은 의욕과 자신감을 높이는 것을 말한다.","4도03-01":"이 성취기준의 취지는 학생이 자신의 삶에서 공정이라는 가치에 관해 성찰하는 기회를 갖도록 하여 공정한 사회로 발전해가는 토대를 마련하려는 것이다. 학생이 공정과 불공정의 사례를 스스로 탐구하고 일상에서 공정을 실제로 추구하는 활동을 실천함으로써 공정의 가치를 생활화할 수 있도록 한다.","4도04-02":"이 성취기준의 취지는 학생이 일상에서 자연스럽게 생태 감수성과 생태전환적 사고에 따라 실천하도록 하기 위한 것이다. 생태전환과 관련된 도덕적 쟁점을 마주할 때 단순히 생태 체험에만 그치지 않고, 인간중심 사고에서 벗어나 자연과의 공존을 위한 생각과 행동의 변화까지 모색한다.","6도01-02":"이 성취기준의 취지는 자신의 행동에 대한 문제점을 확인하고 재정립하도록 하여 반성하는 태도를 기르기 위한 것이다. 학생이 스스로 자기 행동의 문제를 인식하고 개선하려 노력함으로써 바른 도덕 생활의 토대를 마련하도록 한다.","6도02-01":"이 성취기준의 취지는 봉사의 의미와 중요성을 지식적으로만 이해하는 것에 그치지 않고 타인의 환경에 대한 관심을 바탕으로 생활 속에서 자연스럽게 봉사를 실천할 수 있는 역량을 함양하기 위한 것이다. 타인을 위한 봉사 경험을 통해 학생에게 진정한 이타심과 봉사 의지를 다지고 고양할 기회를 제공하도록 한다.","6실01-01":"이 성취기준은 아동기의 신체, 사회⋅정서, 성, 진로 발달의 특징을 이해하여 자신이 여러 영역에서 발달과정에 있다는 것과 발달의 개인차가 있다는 것을 인식하도록 한다. 또한 건강하게 발달하기 위해서는 가족이나 어른들의 도움만이 아니라 자신의 다양한 노력이 필요함을 이해하여 이를 실천한다.","6실01-03":"이 성취기준은 삶의 기본적 조건인 의식주생활을 충족시키는 가족의 역할은 가족이 처한 상황이나 조건에 따라 다양할 수 있음을 알도록 하며, 이 과정에서 가정생활의 중요성과 가정일에 있어서 협력적 소통에 기반한 가족의 역할 분담에 대해 이해하고 실천하도록 한다.","6실01-05":"이 성취기준은 옷이 자기 몸을 보호하고 활동을 편하게 하면서 자신을 표현하는 수단임을 이해하도록 하여 때와 장소, 상황에 따라 건강, 안전, 위생, 예절을 고려한 옷차림을 영위하는 능력과 태도를 기르도록 한다.","6실01-07":"이 성취기준은 가정일 뿐 아니라 직업으로서 일에 대한 필요성을 알고 다양한 직업 중에서 적성, 흥미, 성격 등의 특성을 고려하여 진로 발달 계획을 주도적으로 탐색하도록 한다.","6실02-03":"이 성취기준은 옷, 음식, 생활용품 등 생활자원은 올바른 사용 방법 및 사용 후 버리기 여부의 선택과 처리 방법에 따라 또 다른 생활자원이나 혹은 쓰레기가 될 수 있음을 알고 쓰레기 줄이기 및 분리배출 방법 등을 익혀 실천하도록 한다. 아울러 개인과 가족의 자원 사용이 지구환경에 미치는 영향을 이해하여 생활자원을 소중히 여기고 지속가능한 삶의 태도로서 나눔과 기부를 실천하도록 한다.","6실02-04":"이 성취기준은 자연에서 먹거리로 생산되는 다양한 식재료의 맛을 느끼고 즐길 수 있으며 이 과정에서 맛에 대한 경험을 통해 자연이 주는 먹거리의 의미를 이해하고, 이를 편식 교정 등에 적용할 수 있도록 한다. 특히 지역 및 제철 식품의 이용을 통해 친환경적인 식생활의 의미를 알게 한다.","6실02-06":"이 성취기준은 먹는다는 것의 의미와 음식문화의 기본으로서 우리나라의 고유한 식사 형식인 밥상차림을 이해하도록 한다. 또한 음식을 준비하여 함께 먹는 의미와 즐거움을 경험할 수 있도록 하며 이 과정에서 식사예절이 필요함을 인식하고 이를 실천할 수 있도록 한다.","6실02-08":"이 성취기준은 다양한 바느질 도구와 재료를 활용하여 간단한 생활용품을 만들어 보는 과정에서 즐거움과 의미를 느낄 수 있도록 한다. 아울러 이러한 활동을 통해 손 조작 능력, 도전성, 창의성 등 다양한 능력을 향상할 수 있도록 한다.","6실02-11":"이 성취기준은 건강과 환경을 생각하고 배려의 마음이 깃든 생태 지향적 삶이 왜 필요하고 중요한지를 이해하고, 평소 자신의 의식주 생활습관을 살펴보면서 이를 바탕으로 하여 지속가능한 의식주생활을 위한 구체적인 행동을 계획하고 실천하도록 한다.","6실03-01":"이 성취기준은 발명의 의미를 발견과 비교하여 이해하도록 하고 일상생활에 영향을 끼친 다양한 발명품 사례를 탐색하도록 한다. 또한 발명품 중에서 소외된 지역의 사람들에게 도움을 주는 적정기술 사례를 찾아 나눔과 공유의 가치를 인식하도록 한다.","6실03-02":"이 성취기준은 일상생활에서 불편한 문제를 찾고 이를 해결하기 위하여 다양한 발명 사고 기법을 적용하여 개선된 아이디어를 내도록 한다. 이를 위해 기술적 문제해결 과정(문제 확인, 아이디어 탐색 및 구체화, 실행, 평가)에 따라 창의적인 물건을 구상하고 만들어서 공유하는 메이커 활동으로 연결되도록 한다.","6실03-05":"이 성취기준은 수송 수단의 기본 요소가 구동장치, 조향장치, 제동장치 등으로 구성되어 있음을 일상생활에서의 수송 수단 사례를 들어 설명하여 간단한 수송 수단을 만들고 공유하는 메이커 활동으로 연결한다. 수송 수단의 구동장치를 작동시키기 위하여 태양광 전지와 같은 친환경 에너지를 사용하여 수송 수단을 만들어 보면서 수송기술의 중요성과 가치를 인식하도록 한다.","6실04-01":"이 성취기준은 건설기술의 의미와 특성에 대한 이해를 바탕으로 건설 구조물에는 건축 구조물과 토목 구조물이 있음을 알고 건설 구조물을 탐색하는 체험 활동을 통해 중등의 건설기술과 연계되도록 설정하였다. 특히, 최근 대두되고 있는 친환경 건설 구조물의 사례를 탐색하고 간단한 구조물을 만드는 메이커 활동을 제시한다.","6실04-03":"이 성취기준은 활동으로 만든 발표 자료를 사이버 공간에 공유하는 방법에 대한 이해를 바탕으로 자료를 공유할 때 개인 정보 및 저작권 보호의 중요성을 인식하고 실천하도록 설정하였다. 여기에서는 정보윤리를 지키는 방법에 관해 사례나 구체적인 방법을 제시하도록 한다.","6실04-06":"이 성취기준은 로봇에 다양한 정보기술이 융합되는 사례를 탐색하여 로봇과 융합된 다양한 제품 개발에 대해 알고, 로봇의 다양한 센서와 동작을 위하여 블록 기반 프로그램으로 제어할 수 있는 활동을 하도록 하였다. 여기에서는 ‘디지털 사회와 인공지능’에서 학습한 블록 기반의 교육용 프로그래밍 도구를 활용하여 움직이는 간단한 인공지능형 로봇을 제작하여 구동시켜 보면서 로봇의 작동 원리를 학습하도록 한다.","6실04-09":"이 성취기준은 친환경 농업에 대한 이해를 바탕으로 이를 이루기 위한 농업사례들을 구분하여 지속가능한 농업이 이루어지기 위한 농업의 순환성을 이해하고 중요성을 인식하도록 설정하였다. 특히, 지속가능성 농업의 순환에 대한 다양한 사례(예, 친환경 농업, 스마트팜, 로컬 푸드, 푸드 마일리지 등)를 통해 학습하도록 한다.","6실04-10":"이 성취기준은 생활 속에서 농업활동과 연관 지을 수 있는 모습에 대한 예측을 바탕으로 다양한 농업활동 분야들을 알고 이와 관련된 농업활동 체험을 통해 농업에 대한 관심과 흥미를 가질 수 있도록 설정하였다. 특히, 농업활동은 실내원예활동, 농업생산물 가공 활동, 원예 및 동물치료 활동 등과 같은 생활상의 변화와 관련된 체험을 제시하도록 한다.","6실04-11":"이 성취기준은 농업과 농촌은 농산물 생산뿐 아닌 그 외에도 다원적인 역할을 하고 있음을 이해하고 이에 대한 인식과 이해를 바탕으로 농업과 농촌에 대한 올바른 진로역량을 기르기 위해서 설정하였다. 특히, 다원적인 농업과 농촌의 가치를 환경, 생태, 사회, 문화적인 가치로 분류하여 이와 관련된 진로를 탐색하고 건전한 진로역량을 기르도록 한다.","6실05-01":"이 성취기준은 컴퓨터의 개념을 이해하고 다양한 문제 상황에서 컴퓨터가 활용되는 사례 탐색을 통해 그 가치와 활용 방법을 알 수 있어야 한다. 일상생활에서 컴퓨터를 활용해 해결할 수 있는 문제를 탐색하고, 문제 상황에 제시된 요소들을 분석해 문제의 현재 상태와 목표 상태를 정의한다. 언플러그드 활동 등을 통한 문제 해결 과정을 알고리즘으로 작성하기 위해 자연어, 의사코드(pseudocode), 순서도 등으로 문제 해결 과정을 표현하도록 한다.","6실05-04":"이 성취기준은 놀이⋅체험을 중심으로 생활 주변에서 접할 수 있는 디지털 및 아날로그 데이터를 찾아 각각의 특징을 비교하는 과정을 통해 데이터의 의미를 이해하고, 인공지능에 활용할 수 있는 숫자, 글자, 소리, 이미지 데이터의 유형이나 형태를 탐색할 수 있도록 한다.","6실05-05":"이 성취기준은 기계학습이 적용된 간단한 인공지능 도구의 체험을 통해 기계학습의 기본 원리를 이해하고 인공지능으로 인한 사회의 발전과 직업의 변화를 이해하여 인공지능이 사회에 미치는 영향을 탐색할 수 있어야 한다.","4체01-01":"은 운동이 신체 변화와 체력 증진에 미치는 영향을 이해하기 위해 설정하였다. 운동과 체력의 의미를 이해하고 운동 전후의 신체 및 체력의 변화와 특성을 파악하여 운동의 중요성을 인식하도록 한다.","4체01-02":"는 체력 증진을 위한 기본 운동 방법과 절차를 체험하며 자신의 신체 특성과 체력 수준에 맞게 운동하기 위해 설정하였다. 준비 운동, 본 운동, 정리 운동의 단계별 목적과 주안점을 파악하면서 운동 방법과 절차를 익히고, 자신의 신체 특성과 체력 수준에 적합한 운동을 선택하여 안전하게 시도하도록 한다.","4체01-03":"은 운동과 건강의 관계를 이해하기 위해 설정하였다. 건강의 의미와 운동이 건강을 유지, 증진하는 데 미치는 영향을 탐색하고 운동의 필요성을 파악하도록 한다.","4체01-04":"는 건강을 유지하는 바른 생활 습관을 이해하고 일상생활에서 적극적으로 실천하는 습관을 기르기 위해 설정하였다. 건강한 생활 습관이 신체적 건강뿐만 아니라 정신적, 사회적 건강에도 영향을 미친다는 점을 이해하고, 건강 증진을 위한 생활 태도와 행동을 가정, 학교, 지역사회에서 규칙적으로 실천하도록 한다.","4체01-05":"는 기본 체력운동을 통해 자신에게 적합한 운동 계획을 세우고 실천하기 위해 설정하였다. 체격, 체형, 체력 등 개인마다 다른 신체 특성을 긍정적으로 인식하고 자신의 신체 특성에 맞는 운동을 안전하고 효과적으로 수행하도록 한다.","4체01-06":"은 운동을 통한 건강한 생활 습관 형성의 의지를 기르기 위해 설정하였다. 자신의 운동 및 생활 습관을 점검해 보고, 건강 유지, 증진의 저해 요인을 삼가며, 적절한 운동과 바람직한 생활 태도에 관심을 갖고 적극적으로 실천할 수 있는 의지를 갖도록 한다.","4체02-01":"은 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 일정한 규칙과 방법에 따라 경기 기술을 수행하고 환경과의 상호작용을 통해 발달한 스포츠의 개념과 기술형, 전략형, 생태형 스포츠의 유형별 특성을 이해하도록 한다.","4체02-02":"는 기본 움직임 기술의 의미, 종류(이동 움직임, 비이동 움직임, 조작 움직임)와 특성을 파악하기 위해 설정하였다. 기본 움직임 기술의 종류를 다양하게 탐색하면서 스포츠 활동에 기초가 되는 기본 움직임 기술의 특성과 스포츠 활동 수행과의 관계를 파악하도록 한다.","4체02-03":"은 움직임 요소의 의미를 이해하고, 기본 움직임 기술을 다양한 상황에서 시도하기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 단계적으로 익히고, 움직임 요소(신체, 노력, 공간, 관계)에 변화를 주어 안전하고 효과적으로 기본 움직임 기술을 수행하도록 한다.","4체02-04":"는 기본 움직임 기술을 연결하여 다양하고 복합적인 움직임 기술을 수행하기 위해 설정하였다. 움직임 기술의 종류별(이동 움직임 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 움직임 기술의 치기와 이동 움직임 기술의 달리기의 연결 등)에 기본 움직임을 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 익히고, 간단한 게임 상황에서 시도하도록 한다.","4체02-05":"는 기술형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술의 수월성을 겨루는 기술형 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)을 익히고, 간단한 게임 상황에서 시도하도록 한다.","4체02-06":"은 전략형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술과 전략에 따라 승패가 결정되는 전략형 스포츠 활동의 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(공던지기와 잡기, 공몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)을 익히고, 기본적인 전략을 세워 간단한 게임 상황에서 시도하도록 한다.","4체02-07":"은 생태형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 생활 주변과 자연환경에서 이루어지는 다양한 생태형 스포츠 활동과 관련된 움직임 기술의 수행 방법(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)을 익히고, 간단한 활동 상황에서 안전하게 시도하도록 한다.","4체02-08":"은 기본 움직임 기술의 지속적인 시도를 통해 움직임 기술 수행에 대한 자신감을 기르기 위해 설정하였다. 기본 움직임 기술을 체계적으로 숙달하고, 간단한 규칙을 적용한 활동 상황에서 적극적으로 시도하며 움직임 기술 수행에 대한 자신감을 갖도록 한다.","4체02-09":"는 게임 활동을 수행하며 정해진 규칙을 지키고 최선을 다하는 태도를 기르기 위해 설정하였다. 다양한 유형의 스포츠 활동에 임하는 마음가짐, 구성원에 대한 태도, 규칙 준수의 필요성, 최선의 가치 등을 실제 활동 과정에서 느끼고 실천하도록 한다.","4체02-10":"은 스포츠 활동을 즐길 수 있는 환경에 개방적인 태도를 갖고 적극적이고 안전하게 활동하는 태도를 기르기 위해 설정하였다. 가정, 학교, 지역사회 체육 시설, 자연환경 등 다양하고 도전적인 스포츠 환경을 적극적으로 수용하고 활용하되, 안전 수칙을 숙지하여 안전사고를 예방하는 태도를 실천하도록 한다.","4체03-01":"은 표현 활동의 의미, 표현 활동과 기본 움직임 기술과의 관계를 이해하기 위해 설정하였다. 표현 활동에서의 움직임 기술과 운동 및 스포츠 영역에서의 움직임 기술의 차이를 이해함으로써 표현 활동에서 움직임 기술의 창의적이고 심미적인 특성을 이해하도록 한다.","4체03-02":"는 움직임 요소에 따른 다양한 기본 움직임 기술을 학습함으로써 표현 활동의 기본 수행 능력을 기르기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 체험하되 신체, 노력, 공간, 관계 등 움직임 요소의 변화에 따라 기본 움직임 기술을 창의적이고 심미적으로 표현하도록 한다.","4체03-03":"은 기본 움직임 기술을 활용한 모방 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 사물, 인물, 자연 현상 등의 모양과 움직임을 모방하여 표현하는 방법을 탐색하고 그 특징을 살려 표현하도록 한다.","4체03-04":"는 기본 움직임 기술을 활용한 추상 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 느낌과 생각 등을 동작으로 표현하는 방법을 탐색하고 창의적으로 표현하도록 한다.","4체03-05":"는 기본 움직임 기술을 활용한 리듬 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 박자, 강약, 빠르기, 패턴에 맞춰 표현하는 방법을 탐색하고 리듬감을 살려 표현하도록 한다.","4체03-06":"은 기본 움직임 기술을 활용한 도구 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 줄, 공, 천, 훌라후프 등 도구의 특성을 활용한 표현 방법을 탐색하고 도구의 조작과 움직임을 연결하여 표현하도록 한다.","4체03-07":"은 움직임을 심미적으로 표현하는 것에 대한 호기심과 감수성을 갖도록 설정하였다. 기본 움직임 기술을 아름답게 표현하며 움직임을 심미적으로 표현하는 다양한 자극에 관심을 갖고 운동이나 스포츠 기술과는 다른 감성을 느낄 수 있도록 한다.","6체01-01":"은 3, 4학년군에서 학습한 기본 운동 방법을 체력 요소별로 구분하여 이해하고 체력 요소별로 다양한 운동 방법을 탐색하기 위해 설정하였다. 체력을 건강 체력과 운동 체력으로 구분하고, 유형별 체력 요소를 이해하며, 학습자 스스로 자신의 수준에 적합한 체력 요소별 운동 방법을 찾도록 한다.","6체01-02":"는 자신의 건강 체력과 운동 체력 수준을 파악하여 체력을 증진할 수 있는 다양한 운동 방법을 선택하고 실천하기 위해 설정하였다. 자신의 우수한 체력과 부족한 체력이 무엇인지를 파악하고, 특히 부족한 체력을 기르기 위해 체력 수준에 적합한 운동 방법을 탐색하여 꾸준하게 실천하도록 한다.","6체01-03":"은 자신의 성장 발달을 이해하고, 운동이 성장 발달에 미치는 긍정적인 영향을 이해하기 위해 설정하였다. 성장에 따른 신체적, 정서적 변화, 특히 제2차 성징에 대한 이해를 바탕으로 자신의 성장 발달 양상을 긍정적으로 파악하고, 사춘기에 운동이 신체적, 정서적, 사회적 성장 발달에 바람직한 영향을 미친다는 점을 이해하도록 한다.","6체01-04":"는 운동과 일상생활에서 발생할 수 있는 다양한 안전사고의 유형과 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 침착하게 대처하기 위해 설정하였다. 운동 시설이나 용⋅기구, 지상⋅수상⋅빙상 등의 다양한 운동 환경에서 발생할 수 있는 안전사고, 건강한 성장 발달에 부정적인 생활 습관(흡연, 음주, 약물 오⋅남용 등), 안전을 위협하는 생활 및 자연 환경을 탐색하며 건강하고 안전한 생활 습관을 실천하도록 한다.","6체01-05":"는 체력 증진에 필요한 끈기와 근면성을 기르기 위해 설정하였다. 단기간에 증진되기 어려운 체력 운동의 특성상, 학습자가 운동 과정에서 쉽게 포기하지 않도록 체력 증진을 저해하는 개인적, 환경적 조건을 탐색하고 극복하면서 체력 운동을 규칙적으로 수행하도록 한다.","6체01-06":"은 성장과 발달 과정에서 개인별 차이를 공감하며, 안전을 위협하는 위험 상황에 대처하기 위해 설정하였다. 자신의 신체적, 정서적, 사회적 건강 특성이 다른 사람과 어떤 차이가 있고, 그러한 차이를 공감하는 것이 자신과 공동체에 어떤 영향을 미치는지를 실제 사례를 통해 이해하도록 한다.","6체02-01":"은 기술형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 기술의 수월성을 추구하는 기술형 스포츠의 의미를 이해하고 다양한 환경(지상, 수상, 빙상 등)에서의 움직임 기록 향상을 위한 기록형, 일련의 절차와 방법이 정해진 움직임을 정확하게 수행하는 동작형, 상대방의 신체적 기량과 겨루는 투기형으로 구분하여 유형별 움직임의 세부 특성을 파악하도록 한다.","6체02-02":"는 기록형, 동작형, 투기형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 속도와 거리, 정확성에 도전하는 기록형 스포츠의 기본 기능(도움닫기 하여 멀리뛰기, 목표물에 정확히 던지기 등), 절차와 방법이 정해진 움직임을 수행하는 동작형 스포츠의 기본 기능(손 짚고 옆돌기, 다리 벌려 뛰어넘기 등), 상대방과 신체적 기술을 겨루는 투기형 스포츠의 기본 기능(발차기, 다리 걸기 등)을 게임 상황에 맞게 효율적으로 수행하도록 한다.","6체02-03":"은 기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 기록형, 동작형, 투기형 스포츠를 변형한 게임 활동의 경기 방법을 이해하고, 기록 측정과 분석, 동작 수행의 점검과 분석, 자신과 상대의 기량 확인과 분석 등 기술형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","6체02-04":"는 전략형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 움직임 기능 수행 능력과 전략에 따라 승패가 결정되는 전략형 스포츠의 의미를 이해하고 스포츠의 유형을 상대 영역으로 이동하여 정해진 지점으로 공을 보내 득점하는 영역형, 동일 공간에서 공격과 수비를 번갈아 하며 정해진 구역을 돌아 점수를 얻는 필드형, 네트 너머에 있는 상대 영역에 공을 보내 넘기지 못하게 하여 득점하는 네트형으로 구분하여 각각의 세부 특성을 파악하도록 한다.","6체02-05":"는 영역형, 필드형, 네트형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 패스, 드리블, 슛 등과 같은 영역형 스포츠의 기본 기능, 포구, 송구, 타격, 주루 등과 같은 필드형 스포츠의 기본 기능, 서브, 리시브, 토스, 스트로크(스매싱) 등과 같은 네트형 스포츠의 기본 기능을 변형게임이나 뉴스포츠 수준의 게임 상황에 맞게 효율적으로 수행하도록 한다.","6체02-06":"은 영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 영역형, 필드형, 네트형 스포츠를 변형한 게임이나 뉴스포츠와 같은 게임 활동에 참여하며 경기 방법을 파악하고, 공간 만들기, 공간 차단하기, 골 넣기와 막기, 빈 곳으로 공 치기, 구역과 역할 나누어 수비하기, 빈 곳으로 공 넘기기, 유기적으로 역할 분담하기 등 전략형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","6체02-07":"은 생태형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 다양한 환경 맥락에 따라 활동 특성이 나타나는 생태형 스포츠의 의미에 관한 이해를 바탕으로 생활 주변의 환경을 이용하여 활동하는 생활환경형, 자연환경과 상호작용하며 활동하는 자연환경형으로 구분하여 유형별 세부 특성을 파악하도록 한다.","6체02-08":"은 생활환경형, 자연환경형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 주변 생활환경에서 할 수 있는 골프형 게임, 디스크형 게임, 자전거 타기, 롤러스케이팅, 클라이밍 활동, 민속놀이 등과 자연환경에서 체험할 수 있는 등산 활동, 캠핑 활동, 수상 활동, 설상 활동 등 생태형 스포츠의 기본 기능을 익혀 주변의 다양한 활동 상황에 맞게 환경친화적으로 수행하도록 한다.","6체02-09":"는 생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 생활환경형, 자연환경형 스포츠를 변형한 게임이나 뉴스포츠 수준의 활동에 참여하며 활동 방법을 파악하고 스포츠 환경에 적합한 활동의 선정과 장비 사용, 안전하고 환경친화적인 활동과 정리 등 생태형 스포츠의 기본 활동 방법과 전략을 파악하고 수행하도록 한다.","6체02-10":"은 스포츠 활동에 참여하며 목표 달성을 위한 의지와 상대 기술을 인정하는 태도를 기르기 위해 설정하였다. 스스로 목표를 설정하고 책임감 있게 꾸준히 실천하도록 하며, 함께 참여하는 상대 팀과 구성원의 우수한 기술을 인정하고 배우는 태도를 실천하도록 한다.","6체02-11":"은 스포츠에 참여하며 팀원과 협력하고 구성원을 배려하는 태도를 기르기 위해 설정하였다. 민주적인 의사결정을 통해 역할을 분담하고 전략을 수립하는 등 팀원과의 협력을 강조하며, 기능 수행에 어려움을 겪는 학습자를 도와주고 배려함으로써 팀의 활동 성과를 공유하도록 한다.","6체02-12":"는 스포츠 활동 환경을 아끼고 감사하는 태도를 기르기 위해 설정하였다. 주변의 다양한 스포츠 시설 및 용⋅기구 현황을 탐색하고 이를 적극적으로 활용하면서 학교 및 지역사회가 제공하는 스포츠 복지의 중요성을 이해하도록 한다. 또한 스포츠 환경을 아끼고 보존함으로써 지속해서 혜택을 누릴 수 있다는 점에 감사함을 느낄 수 있도록 한다.","6체03-01":"은 표현 활동 의미와 유형을 이해하기 위해 설정하였다. 스포츠에서 신체 움직임의 심미성을 다루는 스포츠 표현, 민족의 고유한 전통을 신체 움직임으로 표현한 전통 표현, 자유로운 형식으로 움직임을 표현하는 현대 표현의 유형별로 다양한 작품을 직⋅간접적으로 체험함으로써 기본 동작과 구성 방법의 공통점과 차이점을 중심으로 특징을 파악하도록 한다.","6체03-02":"는 스포츠 표현의 기본 움직임 기술과 응용 동작을 탐색하고 심미적으로 표현하기 위해 설정하였다. 신체활동의 예술적 아름다움을 추구하는 스포츠 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 심미적으로 표현하도록 한다.","6체03-03":"은 스포츠 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 스포츠 표현에 적합한 움직임 기술의 응용 동작을 창의적으로 구성하고, 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작의 심미성을 감상하도록 한다.","6체03-04":"는 우리나라와 세계 여러 민족과 지역에서 전해 내려오는 전통 표현에서 기본 움직임 기술을 응용한 동작의 문화적 특징을 파악하고 그 특성을 살려 표현하기 위해 설정하였다. 전통 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 문화적 특색이 드러나게 표현하도록 한다.","6체03-05":"는 전통 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 다양한 전통 표현에 담긴 역사와 특성을 이해하고 전통 표현의 움직임 기술 응용 동작을 문화적 특성에 따라 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작이 갖는 전통적 의미를 감상하도록 한다.","6체03-06":"은 현대 표현에서 기본 움직임 기술을 응용한 동작의 자유로움이 갖는 특징을 파악하고 창의적으로 표현하기 위해 설정하였다. 기본 동작에 적합한 움직임 기술 응용 동작을 기존의 표현 방법이나 틀에 얽매이지 않고 자유롭고 창의적으로 표현하도록 한다.","6체03-07":"은 현대 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 현대 표현에 적합한 움직임 기술의 응용 동작을 표현의 주제와 자유로운 흐름을 고려하여 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도를 현대 사회의 문화적 특징과 비교하며 감상하도록 한다.","6체03-08":"은 다양한 표현 활동 유형을 긍정적으로 수용하고 움직임 표현의 아름다움을 추구하도록 설정하였다. 다양한 표현 유형에 담긴 의미와 표현 특성을 직⋅간접적으로 탐색하며 표현 문화에 대한 이해의 폭을 확장하고 움직임 표현의 아름다움을 추구하도록 한다.","4음01-02":"이 성취기준은 노래나 악기 연주를 통해 기초적인 음악 요소를 표현하도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 익혀 다양한 악곡을 연주하고, 이를 통해 알게 된 점이나 느낌 등을 이야기해 봄으로써 음악 개념과 활동을 의미 있게 연결 짓도록 하는 데 중점을 둔다.","4음01-03":"이 성취기준은 다양한 노래나 악기 연주의 특성을 탐색하고 관련지어 자유롭게 신체나 놀이로 표현하도록 하기 위해 설정하였다. 학습자의 발달 단계에 적합한 흥미로운 신체표현을 통해 음악을 즐기고, 음악을 활용하여 전통과 현대의 다양한 놀이를 하도록 함으로써 노래, 연주 등의 음악 활동이 음악 외의 여러 활동과 연결되도록 하는 데 중점을 둔다.","4음01-04":"이 성취기준은 음악 수업을 통해 학습한 다양한 음악 경험을 생활 속으로 확장하도록 하기 위해 설정하였다. 혼자 또는 여럿이 함께한 노래 및 악기 연주 경험을 바탕으로 가정, 학교 등 주변 생활 속에서 음악을 활용할 수 있는 방법에 대해 살펴보고, 실제 생활에서 간단한 연주 활동에 스스로 관심을 가지고 참여하도록 하는 데 중점을 둔다.","4음02-01":"이 성취기준은 감상곡에 포함된 기초적인 음악 요소를 청각적으로 인식하도록 하기 위해 설정하였다. 음악을 들으며 기초적인 수준의 음악 요소를 탐색해 보고, 노래, 악기, 신체, 언어, 그림 등 다양한 방법으로 자신의 반응을 자유롭게 표현하도록 하는 데 중점을 둔다.","4음02-02":"이 성취기준은 음악의 종류나 주제 등에 따른 음악의 전반적 특징을 발견하며 감상하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악을 감상하며 음악적 특징을 발표하고 공유하는 활동을 통해 다양한 주제가 감상곡에서 어떤 음악적 특징으로 나타나는지 살펴 청각적 인식과 음악적 이해를 연결 짓도록 하는 데 중점을 둔다.","4음02-03":"이 성취기준은 다양한 분위기와 쓰임을 가진 음악을 듣고 경험하도록 함으로써 음악을 활용할 수 있는 능력을 기르도록 하기 위해 설정하였다. 악곡과 관련된 느낌과 감정, 분위기나 장면 등을 떠올려 보고, 이를 노래, 악기 연주, 신체표현, 그림, 영상, 글쓰기 등의 방법으로 묘사해 본다. 나아가 놀이, 의식, 노동 등 생활 속에서 다양하게 쓰이는 음악에 관해 이야기해 보며 음악 감상을 통한 경험을 확장하도록 하는 데 중점을 둔다.","4음02-04":"이 성취기준은 일상생활 속에서 호기심을 가지고 다양한 음악을 들으며 친숙함을 느끼도록 하기 위해 설정하였다. 국악, 서양음악, 세계음악, 대중매체에서 접하는 음악 등을 열린 마음으로 수용하고 즐김으로써 음악 감상을 생활화하도록 하는 데 중점을 둔다.","4음02-05":"이 성취기준은 지역에 전승되어 오는 음악 문화유산에 관심을 갖고 찾아 들으며, 생활 속에서 국악을 즐기는 태도를 가질 수 있도록 하기 위해 설정하였다. 타 교과의 지역 학습과 연계하여 지역의 음악 문화유산을 통해 자신이 속한 지역 문화에 대한 이해를 높이고, 지역에 전승되어 오는 음악 문화유산에 호기심을 가지게 함으로써 생활 속에서 국악을 즐기는 태도를 함양하는 데 중점을 둔다.","4음03-01":"이 성취기준은 주변 경험과 관련된 느낌이나 상상한 바를 음악으로 나타냄으로써 음악적 상상력을 기르도록 하기 위하여 설정하였다. 자신의 느낌이나 상상을 일정한 틀이나 형식에 얽매이지 않고 목소리, 악기, 신체, 물체 등을 활용하여 즉흥적인 소리나 음악으로 표현하는 활동을 하며 자신과 다른 사람의 자유로운 표현을 즐기고 음악에 관한 흥미를 갖도록 하는 데 중점을 둔다.","4음03-02":"이 성취기준은 노랫말 등 악곡의 일부를 바꾸어 표현하고 음악을 기록하는 다양한 방법에 대해 기초적인 수준에서 이해하도록 하기 위해 설정하였다. 음⋅음표, 그림, 기호, 숫자, 문자 등을 활용하여 악보로 나타내고 창작과 공유의 즐거움을 경험하도록 하는 데 중점을 둔다.","4음03-03":"이 성취기준은 음악 요소에 관한 이해를 바탕으로 소리나 음악을 창작하는 기초적인 능력을 기르도록 하기 위해 설정하였다. 기초적인 수준의 음악 요소를 활용하여 짧고 간단한 소리나 음악으로 자유롭게 표현하며 음악 요소에 따른 음악적 효과와 특징을 스스로 인식하도록 하는 데 중점을 둔다.","4음03-04":"이 성취기준은 생활 주변의 소리에 민감하게 반응하고 새로운 음악을 만들어가며 즐길 수 있도록 하기 위해 설정하였다. 일상에서 경험할 수 있는 다양한 소리나 장면을 음악의 관점에서 탐색해 보고 이를 모방하여 노래, 악기 연주, 신체표현 등의 다양한 방법으로 나타내도록 한다. 학습자마다 산출해낸 다양한 결과물을 서로 공유하며 새로운 표현과 그 가능성을 즐기도록 하는 데 중점을 둔다.","6음01-02":"이 성취기준은 악곡에 드러난 음악의 다양한 요소를 익혀 노래나 악기 연주로 표현하는 기회를 가지도록 하기 위해 설정하였다. 여러 음악 요소에 대한 이해를 바탕으로 노래나 악기 연주로 발표하고, 자신의 발표 과정을 스스로 돌아보면서 서로 평하는 데 중점을 둔다.","6음01-03":"이 성취기준은 함께하는 연주 활동을 통해 다양한 소리의 어울림을 경험하고 음악 표현의 재미를 느낄 수 있도록 하기 위해 설정하였다. 목소리, 악기, 신체, 물체, 매체 등을 활용한 다양한 소리와 그 어울림의 특징을 탐구하고, 이를 표현하기 위한 여러 방법을 탐색하도록 한다. 이 과정에서 다른 사람과 함께 활동함으로써 공동체 속에서 음악으로 소통하는 즐거움을 경험하도록 하는 데 중점을 둔다.","6음01-04":"이 성취기준은 학생들이 노래와 악기 연주 기능을 발휘하여 생활 속에서 음악 활동을 실천하는 태도를 기르도록 하기 위해 설정하였다. 가정 및 학교의 행사나 지역 축제 등 생활 속에서 음악이 필요한 상황을 생각하여 적절한 음악을 선택하고 학생들의 수준에 맞는 간단한 형태로 혼자 또는 여럿이 연주를 준비하도록 한다. 연주를 위한 준비 과정과 발표에 참여함으로써 음악을 생활화하며 자기주도적으로 즐기는 태도를 기르도록 하는 데 중점을 둔다.","6음02-01":"이 성취기준은 감상곡의 음악 요소를 감지하여 구별하고 반응하는 능력을 기르도록 하기 위해 설정하였다. 음악을 들으며 악곡에 나타나는 여러 음악 요소를 감지하여 구별하고, 이를 노래, 악기, 신체, 언어, 그림 등의 다양한 방법으로 표현해보면서 이해하는 데 중점을 둔다.","6음02-02":"이 성취기준은 문화권에 따라 다양하게 나타나는 음악의 특징과 음악의 간단한 구성을 인식하도록 하기 위해 설정하였다. 우리나라를 비롯하여 여러 지역이나 나라의 다양한 음악을 듣고 음악의 간단한 구성과 전반적인 특징을 인식하여, 이를 평하기, 설명하기, 표현하기 등의 다양한 행동적 활동을 통해 나타내 보는 데 중점을 둔다.","6음02-03":"이 성취기준은 음악의 내적 측면과 외적 측면을 균형 있게 파악하는 능력을 기르도록 하기 위해 설정하였다. 다양한 음악의 쓰임과 배경을 이해하고 건강, 행사, 환경 등 학습자의 생활과 관련된 다양한 음악의 활용에 대하여 폭넓게 학습하여 이를 설명할 수 있도록 하는 데 중점을 둔다.","6음02-04":"이 성취기준은 생활 속에서 접하는 다양한 음악의 아름다움을 인식하고 공감하는 능력을 기르도록 하기 위해 설정하였다. 국악, 서양음악, 대중음악, 세계음악 등 생활 속에서 접할 수 있는 다양한 음악에 관심을 가지고 스스로 찾아 들으며, 음악에 대한 느낌을 여러 방식으로 표현할 수 있는 데 중점을 둔다.","6음02-05":"이 성취기준은 우리나라 음악 문화유산의 경험을 바탕으로 국악의 가치를 인식하도록 하기 위해 설정하였다. 무형문화재에 대한 이해를 바탕으로 시도 무형문화재, 국가 무형문화재로 지정된 음악 문화유산을 찾아 들어보고 음악적⋅문화적 의미를 이해하여 국악의 가치를 인식하는 데에 중점을 둔다.","6음03-01":"이 성취기준은 음악 창작의 소재로서 느낌과 아이디어를 발산해 내고 이를 음악으로 표현하며 음악적 상상력과 자신감을 기르도록 하기 위해 설정하였다. 자신의 경험과 관련된 다양한 느낌과 아이디어를 떠올려 그림, 기호, 언어 등을 활용하여 기록하고, 목소리, 악기, 물체, 신체, 디지털 매체 등을 통해 새롭게 표현해 보도록 하는 데 중점을 둔다.","6음03-02":"이 성취기준은 음악적 약속으로서 통용되는 기초 기보를 이해하고 이를 활용한 음악 창작 능력을 기르도록 하기 위해 설정하였다. 음이름, 계이름, 율명을 익히고 음악을 기록하는 오선보나 정간보 등의 기보 방법을 기초적 수준에서 이해하여 주어진 조건에 따라 노랫말, 말붙임새 등 악곡의 일부를 바꾸어 기보해본다. 또한 이를 통한 느낌이나 생각을 공유하는 데 중점을 둔다.","6음03-03":"이 성취기준은 음악에서 음악 요소의 의미와 효과를 이해하고 이를 활용하여 음악을 창작하는 능력을 기르도록 하기 위해 설정하였다. 음악 요소의 특징이 드러나는 짧고 단순한 형태의 음악을 간단한 기보, 프로그램, 매체 등을 활용하여 스스로 혹은 협력적으로 만들며 서로의 음악적 산출물을 공유해 보는 데 중점을 둔다.","6음03-04":"이 성취기준은 학생들의 실제 생활과 경험을 토대로 음악 창작과 삶을 연계하여 음악에 대한 긍정적인 태도를 기르도록 하기 위해 설정하였다. 주변의 다양한 상황이나 이야기를 소재로 음악적 아이디어를 끌어내어 간단한 음악극이나 음악 영상 등으로 함께 만들어 나눔으로써 서로의 음악에 대한 열린 태도를 갖고 소통하는 데 중점을 둔다.","4미01-03":"성취기준은 객관적 지식을 적용하거나 고정 관념에 따라 대상을 이해하는 방식에서 벗어나 몸의 다양한 감각으로 직접 대상을 탐색하는 데 호기심을 갖고 참여하며 자신의 감각을 바탕으로 대상의 특징을 이해하는 데 중점을 둔다. 같은 대상이라도 지각하고 반응하는 방식은 학생마다 다를 수 있다. 대상을 지각하며 자연스럽게 떠올린 자신의 감정, 느낌, 생각 등을 나타내고 친구들의 다양한 반응을 접하며 자신만의 고유한 감각을 통해 대상이 지닌 다채로운 특징을 이해한다.","4미02-02":"성취기준은 기본적인 표현 재료의 물성을 경험하고 표현 용구의 사용법을 충분히 익히는 활동에 중점을 둔다. 표현 재료와 용구는 단순히 표현 수단을 넘어 그 자체로서 학생들에게 새로운 느낌과 생각을 가지게 한다. 초등학교 3~4학년 수준에서 다룰 수 있는 기본적인 표현 재료에는 종이류(도화지, 색종이, 한지 등), 드로잉 재료(연필, 펜 등), 채색 재료(크레파스, 파스텔, 수채화물감, 아크릴물감, 먹 등), 조소 재료(찰흙, 종이죽, 공예용 철사 등)가 있으며 그 밖에 생활 속에서 익숙하게 다루고 있는 다양한 생활용품 및 디지털 매체를 활용할 수 있다.","4미02-03":"성취기준은 미술 표현에 기초가 되는 조형 요소의 특징을 탐색하고 표현 주제와 연결 지어 조형 요소를 활용하는 데 중점을 둔다. 조형 요소에는 선, 형과 형태, 색, 질감, 양감 등이 있다. 각 조형 요소를 탐색하여 시각적 특징을 발견하고 표현하고자 하는 주제와 어울리는 조형 요소를 찾아 주제 표현에 활용한다.","4미02-04":"성취기준은 작품 제작을 위한 계획 단계부터 작품을 완성한 후 발표 및 전시에 이르기까지 학생들의 제작 의도와 작품을 대하는 태도에 중점을 둔다. 작품 제작에 분명한 의도를 갖는 것은 주도적으로 작품을 제작하는 바탕이 되어 표현 재료와 용구, 조형 요소의 특징을 탐색하여 작품에 활용하는 일련의 과정을 이끈다. 또한, 자신의 의도에 따라 주도적으로 제작한 작품에는 특별한 의미가 부여되어 작품을 소중히 여기는 태도로 이어질 수 있다.","4미03-01":"성취기준은 작품에 대한 교사의 질문이나 조사에 의존하는 감상 방식에서 벗어나 학생들이 작품을 충분히 보고 자신의 느낌과 생각을 바탕으로 질문을 만들어 상호 작용하는 데 중점을 둔다. 질문하기를 통한 감상은 작품과 나누는 대화의 시작이다. 작품 정보를 활용한 질문, 작품의 내용이나 형식에 관한 질문, 작가의 입장이 되어 던지는 질문 등 다양한 질문을 통하여 학생들이 감상에 흥미를 느끼고 감상 관점을 기르도록 한다.","6미01-02":"성취기준은 자신이나 대상, 그리고 시시각각 변화하는 현상 등 주변 환경을 탐색하며 예민하게 찾은 감각적 특징과 체험 과정에서 떠오른 느낌과 생각을 관련지어 보는 경험에 중점을 둔다. 미술의 특성상 시각적 특징을 우선 다루게 되지만, 보이지 않아도 느낄 수 있는 특징이나 느낌과 상상이 반영된 색, 형, 이미지, 문구, 소리, 움직임 등을 자유롭게 활용한다. 이를 통해 감각이 사고에 미치는 영향뿐만 아니라 자신과 환경 사이의 관계를 이해한다.","6미01-03":"성취기준은 주변 환경 속 대상과 민감하게 상호 작용하며 경험한 느낌과 생각을 바탕으로 대상에 이름 붙이기, 자신을 닮은 대상 찾기, 대상을 연결하여 이야기 만들기 등 대상에 의미를 부여하는 활동에 중점을 둔다. 보는 사람, 시간과 장소, 분위기 등에 따라 대상과 다양하게 교감하며 그 과정에서 생성되는 의미를 성찰할 수 있도록 한다. 이를 통해 예술적 사고를 이끄는 대상의 가치를 이해하고 자신과 환경과의 생태 전환적 관계를 인식한다.","6미02-02":"성취기준은 하나의 표현 주제에도 다양한 표현 방식이 있음을 이해하고 학생들이 자신의 의도에 따라 표현 재료와 방법을 선택하여 작품을 제작하는 데 중점을 둔다. 표현 주제에 적합한 표현 재료와 용구의 쓰임을 학생 스스로 탐색하고 습득하여 주제가 잘 드러날 수 있도록 적용하게 한다. 특히, 디지털 매체는 신체적 감각과 지각을 확장하는 표현의 도구로써 디지털 매체의 특징과 사용법을 익혀 작품 제작에 효과적으로 활용하게 한다.","6미02-04":"성취기준은 계획 단계를 비롯한 작품 완성의 전 과정에서 주제 표현에 의지를 갖고 표현 방법과 절차를 재고하는 성찰의 태도를 기르는 데 중점을 둔다. 주제 표현의 의지를 갖는 것은 표현 주제를 나타내기 위해 다양한 표현 재료와 용구, 조형 요소와 원리를 작품에 활용하는 일련의 과정을 이끈다. 또한 작품을 주도적으로 돌아보고 보완하며 발전시키는 경험을 통해 학생들은 작품 완성의 기준을 스스로 설정하고 창작에 대한 상위 인지를 활성화한다.","6미03-03":"성취기준은 교실 수업이라는 시공간을 확장하여 전시, 지역 축제, 문화 행사 등 학생들이 살아가는 지역 사회의 미술 문화에 관심을 가지고 적극적으로 참여함으로써 문화를 향유하는 태도를 생활화하는 데 중점을 둔다. 또한 그 경험을 공유하고 소통함으로써 새로운 문화를 생성해가는 데까지 관심을 확장한다.","2바01-04":"의 ‘생태환경’은 자연, 사람을 포함한 생명체들이 더불어 살아갈 수 있는 환경을 의미한다. 이 성취기준에서는 이를 위한 여러 가지 방법을 알고 알아낸 것을 소통하며 서로 공감하고 실천하는 활동들을 포함한다.","2바02-01":"에서 ‘공동체’의 범위는 나와 관련 있거나 내가 참여하는 공동체이다.","2바02-03":"에서 ‘차이나 다양성 존중’은 공동체마다 언어, 의상, 음식, 놀이 등이 어우러진 문화를 형성하며 살아간다는 것을 이해한다는 의미이다.","2바02-04":"의 ‘새로운 활동’은 일상적인 삶의 공간에서 학생들이 호기심을 갖고 새롭게 도전하거나 시도해 볼 가치가 있는 활동이다.","2바03-03":"에서 ‘공동체성’은 함께 사는 삶을 위해 발휘하고 실천해야 할 행동 양식을 의미한다. 또한 여기서의 ‘인물’은 과거에 살았거나 현재 살고 있는 사람 중에서도 특히 공동체성을 발휘한 위인, 의인, 봉사하는 사람 등을 이른다.","2바03-04":"의 ‘지속가능성을 위한 삶의 방식을 찾아 실천한다’는 것은 범지구적인 관점에서 상생에 필요한 생활 방식을 이야기하고 지금 실천할 수 있는 일을 다룬다.","2바04-01":"에서 ‘모두를 위한 생활환경’은 보편적 설계를 풀어쓴 용어로 연령, 성별, 국적, 장애의 유무 등과 관계없이 누구나 불편 없이 이용하고 편안하게 생활할 수 있는 환경을 의미한다.","2슬01-03":"의 ‘주변 사람’은 물리적으로 가까운 사람뿐만 아니라 오가며 지내는 사람, 마음을 나누는 사람 등을 포함한다.","2슬01-04":"의 ‘생태’는 지금, 여기에서 우리와 함께 살아가며 상호 작용하는 생물과 영향을 주고받는 환경을 모두 아우르는 개념이다.","2슬02-02":"의 ‘우리나라의 모습’은 우리나라 모습, 상징, 특징 등을 의미하며, 우리나라 문화란 우리 고유의 생활양식으로 남북한이 공유하는 문화까지 포괄한다.","2슬02-04":"에서 ‘궁금한 세계’는 우주나 바닷속, 땅속, 가상 공간 등과 같이 내가 살고 있는 곳과 멀리 떨어져 있는 물리적, 심리적 공간을 의미한다.","2슬03-01":"에서 ‘하루’는 낮과 밤으로 구분하는 자연적 시간이라는 의미와 낮과 밤에 따라 살아가는 사람들의 생활을 구분하는 사회적 시간이라는 의미를 포괄한다.","2슬03-04":"의 ‘지속가능성의 사례’는 인류의 보편적 문제, 지구 환경 문제, 경제⋅사회 문제 등을 포함한다.","2슬04-03":"에서 ‘관심 있는 주제’는 학생이 몰입해서 흥미 있게 탐구할 수 있는 주제를 의미한다.","2즐01-01":", [2즐01-02]의 ‘놀이’는 일정한 규칙이나 방법에 따라 노는 좁은 의미의 놀이 활동뿐만 아니라 학생이 자발적으로 참여하고 몰입함으로써 자유로움과 즐거움을 느낄 수 있는 모든 활동을 의미한다.","2즐02-01":", [2즐02-02], [2즐02-03]의 ‘문화 예술’은 공간적, 물리적 한계를 넘어서 멀리 있더라도 참여할 수 있는 다양한 놀이, 표현, 감상 활동 등을 포함한다.","2즐02-04":"의 ‘다양한 세상’은 학생이 경험한 세상뿐만 아니라 미지의 우주, 바닷속이나 땅속, 온라인 기반의 상상할 수 있는 세상 등을 포함한다.","2즐04-04":"에서 ‘의미’는 특별히 기억에 남는 경험에 대한 개인적이고 맥락적인 생각이나 느낌 또는 그 경험에 대해 나름대로 부여하는 가치를 말한다."};

기 위한 계획 세우기"]]],["가치·태도","",[["환경 위기를 극복하는 자세"],["미래 세대에 대한 책임의식 함양"]]]]}}},"실과":{"인간 발달과 주도적 삶":{"name":"인간 발달과 주도적 삶","core":["인간 발달에 대한 이해는 자립적인 삶을 이끌고 타인과의 건강한 관계를 형성하는 기초가 된다.","일상에서 직면하는 문제에 대처할 수 있는 역량은 개인 및 가족의 긍정적 발달과 행복한 일상의 삶을 주도적으로 이끌 수 있게 한다.","일상에서 직면하는 상호 존중과 협력적 소통에 기반한 관계맺음의 경험은 건강한 대인 관계를 확장하는 밑거름이 된다.","가정일과 생활 습관은 변화하는 일상에서 개인 및 가족의 요구와 문제를 해결해 나갈 수 있게 하면서 생활방식과 진로를 스스로 개척하고 성장하기 위한 바탕이 된다."],"g":{"5~6":[["지식·이해","",[["아동기 발달과 자기이해"],["자립적 일상생활"],["균형 잡힌 식사"],["옷의 기능과 옷차림"],["가정생활과 가정일"],["진로 발달과 직업"]]],["과정·기능","",[["건강한 발달을 위한 자기 관리 방법 탐색하기"],["자립적 일상생활에 필요한 조건 살펴보기"],["가족원의 다양한 요구 파악하기"],["바람직한 식습관 형성하기"],["건강하고 적절한 옷차림 파악하기"],["가정생활을 유지하는 가정일의 종류 살펴보기"],["가정일 수행에 참여하기"]]],["가치·태도","",[["아동기 발달에 대한 긍정적인 수용"],["일상생활 속 올바른 생활습관과 예절을 실천하는 태도"],["가족 간 배려와 돌봄의 가치"],["협력적 소통에 기반한 역할 분담의 가치 수용"],["일과 노동의 가치"],["진로를 주도적으로 탐색하는 태도"]]]]}},"생활환경과 지속가능한 선택":{"name":"생활환경과 지속가능한 선택","core":["삶의 욕구와 문제를 해결하는 과정에서 인간이 경험하는 생활자원의 제한성은 개인과 가족의 관리능력을 요구한다.","생활의 기본 조건으로서 의식주 생활의 수행능력을 갖추는 일은 창의적이고 가치 있는 삶을 설계하고 영위할 수 있는 기초가 된다.","변화하는 생활환경을 안전하고 건강하게 유지하고자 하는 개인과 가족의 책임 있는 행동을 통해 소비자 시민성을 함양할 수 있다.","일상생활에서 지속가능한 선택을 지향하는 것은 현재 생활공동체와의 공존과 함께 미래 세대의 건강한 삶을 위한 책임 있는 행동이다."],"g":{"5~6":[["지식·이해","",[["생활자원의 특징"],["생활자원의 보관과 활용"],["식재료의 생산과 선택"],["음식의 마련과 섭취"],["옷이나 생활용품의 구성"],["생활공간과 정리정돈"],["지속가능한 의식주생활"]]],["과정·기능","",[["생활자원의 사용가치를 높이는 방법 탐색하기"],["합리적인 관리 방법 실천하기"],["자신의 선택이 공동체의 삶과 환경에 미치는 영향 설명하기"],["음식을 마련하는 과정 체험하기"],["생활용품을 만드는 과정 경험하기"],["생활 속 의생활 문제 해결하기"],["생활공간을 청결하게 하는 과정 경험하기"],["일상생활에서의 지속가능한 행동을 계획하여 실천하기"]]],["가치·태도","",[["생활자원을 소중하게 여기는 태도"],["함께하는 식사의 즐거움"],["식사 예절을 실천하는 태도"],["직접 만들어 쓰기의 가치와 창의적 태도"],["제작 과정에서 절차적 사고를 중시하는 태도"],["안전한 생활을 실천하는 태도"],["쾌적한 생활공간 유지를 위한 노력"],["나눔의 봉사활동과 기부문화의 존중"]]]]}},"기술적 문제해결과 혁신":{"name":"기술적 문제해결과 혁신","core":["기술은 인간의 필요와 욕구를 충족하기 위한 혁신적인 문제 해결 활동으로 인류 문명을 주도하고 사회⋅문화⋅경제 등에 바람직한 영향을 끼치도록 활용되어야 한다.","인간은 기술적 문제 해결 과정을 통해 발명 문제를 창의적으로 해결하며, 지식재산에 대한 보호 및 발명과 혁신은 기술의 가치를 높인다.","창의적인 제품의 개발은 기술적 문제 해결 과정을 통해 이루어지며, 제품을 생산하기 위해서는 설계 활동 및 다양한 재료와 도구의 활용이 필요하다.","친환경 에너지를 활용한 수송 수단은 자원의 고갈과 환경 문제를 극복하는 대안이며, 혁신적 수송 수단과 물류 체제 구축은 제품의 효율적인 수송을 가능하게 한다."],"g":{"5~6":[["지식·이해","",[["발명의 의미와 발명품"],["기술적 문제 해결과 발명사고기법"],["발명과 특허의 개념"],["지식재산권의 중요성"],["수송의 의미와 수송 수단의 발달"],["수송 수단의 구성 요소"]]],["과정·기능","",[["생활 속 기술적 문제 확인하기"],["창의적인 제품 구상하기"],["발명 제품의 설계와 제작하기"],["발명품의 특허 정보 검색하기"],["다양한 수송 수단 탐색하기"],["친환경 수송 수단의 설계와 제작하기"]]],["가치·태도","",[["발명과 기술에 대한 관심과 흥미"],["기술에 대한 가치 인식"],["발명 아이디어 발상의 실천적 태도"],["지식재산보호에 대한 인식"],["미래 수송 수단에 대한 관심"]]]]}},"지속가능한 기술과 융합":{"name":"지속가능한 기술과 융합","core":["건설기술은 쾌적하고 편리하며 안전한 생활을 위한 다양한 설계와 시공 및 유지관리 방법을 적용하고 있으며, 다른 산업의 수행을 위한 기반 요소로서 가치를 가진다.","로봇은 기계요소, 전기전자 등의 하드웨어와 이를 제어하는 소프트웨어로 구성되며, 여러 가지 기술과 지식이 적용된 첨단 융합기술의 산물로서 사회 각 분야에 활용된다.","정보통신 기술의 발달은 시공간 극복을 통해 정보와 문화의 교류 및 세계화에 기여해왔으며, 다양한 기술과 융합하여 인간을 새로운 영역으로 이끈다.","생명기술은 다양한 기술과 융합하여 발달하고 있으며, 식량자원의 활용과 농업의 순환체험은 지속가능한 미래 생활을 위한 기초가 된다."],"g":{"5~6":[["지식·이해","",[["건설기술의 개념과 친환경 구조물"],["디지털 기술의 특징과 디지털 콘텐츠의 종류"],["로봇의 개념과 작동 원리"],["로봇 융합기술의 이해"],["생활 속 동식물의 이해"],["동식물 자원의 분류"],["동식물 자원의 친환경 농업"],["미래생활과 연관된 농업활동"],["농업과 농촌의 다원적인 역할"]]],["과정·기능","",[["생활 속 건설 구조물 탐색과 체험하기"],["디지털 콘텐츠의 제작과 공유하기"],["간단한 로봇의 조립과 작동시키기"],["로봇의 동작에 코딩 프로그램 적용하기"],["융합적 사고하기"],["동식물과 관련된 생명기술 탐색하기"],["동식물을 기르고 가꾸기"],["생활 속 농업활동 체험하기"]]],["가치·태도","",[["건설기술에 대한 가치 인식"],["로봇에 대한 관심과 흥미"],["건전한 사이버 공간의 활용 태도"],["동식물에 대한 생태존중감을 갖는 태도"],["지속가능한 농업의 순환성과 중요성 인식"],["농업에 대한 관심과 흥미"],["농산업에 대한 올바른 진로관을 갖는 태도"]]]]}},"디지털 사회와 인공지능":{"name":"디지털 사회와 인공지능","core":["프로그래밍은 디지털 사회에서 발생하는 다양한 문제를 해결하는 데 도움을 준다.","컴퓨터로 처리할 수 있는 데이터는 디지털 데이터이며, 문제 해결을 위한 명령은 명확한 절차가 필요하다.","인공지능은 인간의 지능을 모방하여 만든 프로그램 시스템으로 생활 속의 다양한 분야에 영향을 미친다."],"g":{"5~6":[["지식·이해","",[["컴퓨터의 개념"],["문제 찾기와 문제 해결 절차"],["컴퓨터에게 명령하는 방법"],["데이터의 종류와 표현"],["생활 속 인공지능"]]],["과정·기능","",[["생활 속에서 활용되는 컴퓨터의 사례 탐색하기"],["일상생활의 문제를 해결하기 위한 알고리즘 구상하기"],["문제를 해결하는 기초적인 프로그래밍하기"],["데이터 간에 공통되는 유형이나 형태 탐색하기"],["인공지능이 만들어지는 과정 탐색하기"]]],["가치·태도","",[["생활 속에서 컴퓨터를 활용해 해결 가능한 문제를 탐색해 보려는 자세"], function unitTools(sd){
  const L=sd&&UNIT_TOOLS[sd.s+"|"+sd.area];if(!L)return null;
  const out=[];
  L.forEach(e=>{
    const k=e.lastIndexOf("@"),name=k<0?e:e.slice(0,k),re=k<0?null:new RegExp(e.slice(k+1));
    if(re&&!re.test(sd.t))return;
    const hits=C.map((c,i)=>({c,i})).filter(x=>x.c.x&&x.c.tools[0].n===name);
    const pick=hits.find(x=>x.c.s===caseSubj(sd.s))||hits[0];
    if(pick&&!out.some(o=>o.i===pick.i))out.push(pick);
  });
  return out;
}

// 단계 도구 추천: 고른 과목(과 '공통')만 보여 줌. 다른 과목 사례는 '같은 도구, 다른 목표' 탭에서 봄.
function recs(stage){
  const sd=stdOf(S.std);
  const mine=C.map((c,i)=>({c,i,n:score(c,stage)})).filter(({c})=>c.s===caseSubj(S.subj)||c.s==="공통");
  const fit=x=>x.c.x?x.c.sgl.includes(stage):(!x.c.sd||x.c.st===stage);
  const byN=(a,b)=>b.n-a.n;
  let match=[],unit=null;
  if(sd){
    unit=unitTools(sd);
    if(unit)match=unit.map(({c,i})=>({c,i,n:score(c,stage)}));
    else match=mine.filter(({c})=>c.x&&c.kre&&c.t===sd.type&&c.kre.test(`${sd.area} ${sd.t}`)); // 단원을 이어 두지 못한 과목: 성취기준 낱말과 활동 유형이 모두 맞는 것만
    match=match.map((x,k)=>({...x,k})).sort((a,b)=>(fit(b)-fit(a))||(a.k-b.k));
  }
  // 교안 사례: 고른 성취기준에 직접 이어 둔 것만(DECK_STD). 성취기준 없이 목표를 직접 쓴 경우에는 그 과목의 이 단계 사례를 보여 줌
  const staged=mine.filter(x=>!x.c.x&&x.c.s!=="공통"&&(sd?((DECK_STD[x.c.goal]||[]).includes(sd.c)&&(!x.c.sd||x.c.st===stage)):(x.c.sd&&x.c.st===stage)));
  const used=new Set([...match,...staged].map(x=>x.i));
  const generic=mine.filter(x=>!used.has(x.i)&&(x.c.s==="공통"||(x.c.x&&!x.c.kre&&!UNIT_NAMED.has(x.c.tools[0].n)))&&fit(x)).sort(byN);
  const gset=new Set(generic.map(x=>x.i));
  const other=mine.filter(x=>!used.has(x.i)&&!gset.has(x.i)).sort(byN);
  return {staged,match,generic,other};
}
function card(c,i,stg){

}

function ceOf(sd){

  return {name:t.name,cats:CATS.map(cat=>[cat,(t.g[sd.b]||[]).filter(r=>r[0]===cat).flatMap(r=>r[2].map(i=>i[0]))])};
}

}

    const sd=stdOf(S.std);
    box.innerHTML=`<div class="band"><div class="bl">STEP 08 · 고른 도구 활용표</div><h2>${esc(S.goal||"(학습 목표를 적어 주세요)")}</h2></div>
      <dl class="facts"><dt>과목·학년</dt><dd>${esc(S.subj||"")} ${esc(S.grade||"")}</dd>${sd?`<dt>성취기준</dt><dd>[${sd.c}] ${esc(sd.t)}</dd>`:""}<dt>중점 활동</dt><dd>${typeName(S.type)}</dd><dt>필요한 기능</dt><dd>${S.feats.map(k=>FEATURES[k]).join(", ")||"-"}</dd></dl>
      <div class="tablewrap"><table><thead><tr><th>단계</th><th>도구로 하는 일</th><th>도구</th><th>도구의 역할</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.stg}</td><td>${esc(r.act)}</td><td>${r.tools.length?r.tools.map(t=>`<div class="tcell">${esc(t.n)}${t.u?` <a class="go small" href="${t.u}" target="_blank" rel="noopener">열기 ↗</a>`:""}</div>`).join(""):esc(r.tool)}</td><td>${esc(r.role)}</td></tr>`).join("")}</tbody></table></div>
      ${ceDone(sd)}
      <div><span class="label">기준 점검</span><div class="status">${names.map((x,n)=>`<span class="pill2 ${S.checks[n]?"ok":"no"}">${S.checks[n]?"✓":"다시 보기"} ${x}</span>`).join("")}</div></div>
      <div><span class="label">AI 윤리 · 생각해 볼 점</span>${S.rule||ethic.length?`<ul>${S.rule?`<li>${esc(S.rule)}</li>`:""}${ethic.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="why">아직 적지 않았어요. 이전 단계에서 우리 반 규칙을 적어 보세요.</p>`}</div>`;
    S._rows=rows;S._ethic=ethic;
  }
  const pt=box.querySelector(".point"),bd=box.querySelector(".band");if(pt&&bd)bd.after(pt);
  $("nowbar").innerHTML=step.k!=="goal"&&step.k!=="done"?nowHTML():"";
  const ne=$("nowEdit");if(ne)ne.onclick=()=>{S.step=0;render();window.scrollTo({top:0})};
  navState();save();
}
function canJump(i){return i<=S.step||(S.subj&&S.goal&&S.type)}
function navState(){
  const k=STEPS[S.step].k;
  $("prev").disabled=S.step===0;
  const blocked=(k==="goal"&&(!S.subj||!S.goal.trim()))||(k==="type"&&!S.type);
  $("next").disabled=blocked;
  $("next").textContent=k==="check"?"활용표 보기":k==="done"?"활용표 복사하기":"다음";
  $("prev").textContent=k==="done"?"처음부터 다시":"이전";
}
$("next").onclick=()=>{
  if(STEPS[S.step].k==="done"){copyPlan();return}
  S.step=Math.min(S.step+1,STEPS.length-1);render();window.scrollTo({top:0});
};
$("prev").onclick=()=>{
  if(STEPS[S.step].k==="done"){S={...structuredClone(EXAMPLE),subj:null,grade:"",std:null,goal:"",type:null,feats:[]};render();return}
  S.step=Math.max(S.step-1,0);render();
};
function copyPlan(){
  const r=S._rows||[],sd=stdOf(S.std);
  const lines=[`학습 목표: ${S.goal}`,`과목·학년: ${S.subj||""} ${S.grade||""}`,...(sd?[`성취기준: [${sd.c}] ${sd.t}`]:[]),`중점 활동: ${typeName(S.type)}`,`필요한 기능: ${S.feats.map(k=>FEATURES[k]).join(", ")}`,"",
    "단계\t도구로 하는 일\t도구\t도구의 역할\t사이트",...r.map(x=>[x.stg,x.act,x.tool,x.role,x.tools.map(t=>t.u).filter(Boolean).join(" ")].join("\t")),"",
    ...ceLines(sd),
    `AI 윤리: ${[S.rule,...(S._ethic||[])].filter(Boolean).join(" / ")}`];
  navigator.clipboard.writeText(lines.join("\n")).then(()=>toast("활용표를 복사했어요. 한글·구글시트에 붙여 넣으세요")).catch(()=>toast("복사가 막혔어요. 표를 드래그해 복사해 주세요"));
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

function renderTools(){
  const groups={};
  C.filter(c=>!c.x).forEach(c=>c.tools.forEach(t=>{const k=t.n.replace(/^Gemini$|^Gemini 젬스$/,"제미나이").replace(/^캔바 AI$|^Canva 3D 웹툰$/,"캔바").replace(/^블루킷 퀴즈$/,"블루킷");(groups[k]=groups[k]||{u:t.u,list:[]}).list.push({c,r:t.r})}));
  $("toolGroups").innerHTML=Object.entries(groups).filter(g=>g[1].list.length>1).sort((a,b)=>b[1].list.length-a[1].list.length).map(([k,g])=>`<div class="toolgroup"><h3>${esc(k)}<small>${g.list.length}가지 활동</small>${g.u?`<a class="go small inv" href="${g.u}" target="_blank" rel="noopener">열기 ↗</a>`:""}</h3><div class="uses">${g.list.map(({c,r})=>`<div class="use"><span class="meta"><span class="tag t">${esc(c.s)}</span><span class="tag">${typeName(c.t)}</span></span><b>${esc(c.goal)}</b><span>${esc(r||c.a)}</span></div>`).join("")}</div></div>`).join("");
}
// 탭 3: 과목·학년군별 성취기준과 내용 체계
const SRC_OK="성취기준 문장은 교육부 고시 원문(PDF)과 한 줄씩 대조했어요.";
const SRC_X="성취기준 문장은 공개 교육과정 데이터 두 곳에서 서로 같은 문장으로 확인했어요. 고시 원문(PDF)과의 대조는 아직이에요.";
function renderCur(){
  if(!S.cs)S.cs=S.subj||"국어";
  const bs=bandsOf(S.cs);
  if(!bs.includes(S.cb))S.cb=bs.includes((S.grade||"").replace("학년",""))?S.grade.replace("학년",""):bs[0];
  const s=S.cs,b=S.cb;
  $("curSubj").innerHTML=CUR_ORDER.map(x=>`<button class="chip" data-s="${esc(x)}" aria-pressed="${x===s}">${esc(x)}<small>${STD.filter(y=>y.s===x).length}</small></button>`).join("");
  $("curBand").innerHTML=BANDS.map(x=>`<button class="chip" data-b="${x}" aria-pressed="${x===b}" ${bs.includes(x)?"":"disabled"}>${x}학년</button>`).join("");
  $("curSubj").querySelectorAll(".chip").forEach(x=>x.onclick=()=>{S.cs=x.dataset.s;save();renderCur()});
  $("curBand").querySelectorAll(".chip").forEach(x=>x.onclick=()=>{S.cb=x.dataset.b;save();renderCur()});
  const list=STD.filter(x=>x.s===s&&x.b===b);
  const units=[...new Set(list.map(x=>x.area))];
  const areas=Object.keys(CE[s]||{}).filter(a=>(CE[s][a].g[b]||[]).length);
  $("curBody").innerHTML=`
    <h2 class="h2c">${esc(s)} ${b}학년 <small>성취기준 ${list.length}개 · 내용 체계 ${areas.length?`영역 ${areas.length}개`:"없음"}</small></h2>
    <p class="src">${list[0]?.ok?SRC_OK:SRC_X}${CE[s]?` 내용 체계는 고시 원문의 표에서 ${b}학년 칸만 옮겼어요.`:""}</p>
    <span class="label">성취기준</span>
    ${units.map(u=>{const xs=list.filter(x=>x.area===u);return `<div class="curunit"><h3>${esc(u)}<small>${xs.length}개</small></h3><div class="in">${xs.map(x=>`<div class="srow"><code>[${x.c}]</code><span>${esc(x.t)}</span><button class="btn" data-c="${x.c}">이 성취기준으로 고르기</button></div>`).join("")}</div></div>`}).join("")}
    <span class="label">내용 체계 · 내용 요소</span>
    ${CE[s]?areas.map(a=>{const t=CE[s][a];return `<div class="curunit"><h3>${esc(t.name)}<small>${b}학년</small></h3><div class="in">${ceGrid(s,b,a)}<details class="core"><summary>핵심 아이디어</summary><ul>${t.core.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details></div></div>`}).join(""):NO_CE(s)}
    <p class="src">출처: 교육부 고시 제2022-33호 [별책] 초등학교 교육과정과 교과별 교육과정. ‘학년 공통’ 표시는 원문 표에서 여러 학년군 칸이 합쳐져 있던 내용 요소예요.</p>`;
  $("curBody").querySelectorAll(".srow .btn").forEach(x=>x.onclick=()=>{
    const sd=stdOf(x.dataset.c);if(S.subj!==sd.s){S.picks={};S.acts={}}
    pickStd(sd);S.area="";S.q="";S.step=0;setTab("design");render();window.scrollTo({top:0})});
}
function setTab(w){["design","tools","cur"].forEach(k=>{$("tab-"+k).setAttribute("aria-selected",w===k);$("view-"+k).hidden=w!==k});if(w==="cur")renderCur()}
["design","tools","cur"].forEach(k=>$("tab-"+k).onclick=()=>setTab(k));
renderTools();render();
</script>
